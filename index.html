e positive for energy to be released. This mass does not vanish; it is carried away as kinetic energy (and radiation). ","The α decay of ²¹²Po releases Q=8.95 MeV. About how many u is the mass difference before and after the reaction? ","Total resistance R₁+R₂=4+8=12 Ω, current I=12/12=1 A, the same everywhere, so R₁ gets 4 V and R₂ gets 8 V; the voltage ratio 4:8 equals the resistance ratio. The larger R₂ is, the larger its share of the voltage, but the total current decreases at the same time. ","If R₂ is changed to 16 Ω (R₁=4 Ω and the 12 V source unchanged), what is the voltage across R₂? ","With the switch closed, the 6 Ω branch carries 12/6=2 A, the 3 Ω branch with the switch carries 12/3=4 A, and the total current is 6 A. When the switch is opened, the 3 Ω branch is open and its current is zero; the 6 Ω branch still has the source's 12 V across it and its current is still 2 A; so the total current drops from 6 A to 2 A. ","With the switch kept closed, the 6 Ω resistor is replaced by 12 Ω. What is the total current supplied by the source? ","Let the middle node voltage be V: (12−V)/2+(5−V)/3=V/6, giving V=46/6≈7.67 V. The current in the left 2 Ω is (12−7.67)/2≈2.17 A; the current in the right 3 Ω is (5−7.67)/3≈−0.89 A, and the negative sign means the actual current flows into the 5 V source, which is being charged and absorbs power; the current in the 6 Ω resistor is 7.67/6≈1.28 A. Current conservation at the node: 2.17=1.28+0.89. ","If the right-hand source is changed from 5 V to 8 V (other elements unchanged), what is the current in the 6 Ω resistor? ","At balance, the left arm's divided voltage is 10×4/(4+4)=5 V and the right arm's is 10×6/(6+6)=5 V, so the two ends of the bridge are at the same potential and the 3 Ω bridge resistor carries zero current; therefore the bridge resistance can have any value without affecting the other currents. The balance condition is equal resistance ratios on both sides: upper arm/lower arm is the same on the left and right. ","The left arm is changed to an upper arm of 4 Ω and a lower arm of 12 Ω; the right arm's upper arm stays 6 Ω. What should the right arm's lower arm be, in Ω, so that the current in the bridge resistor is exactly zero? ","Both branches have 12 V across them, P=V²/R: the 4 Ω branch gives 144/4=36 W and the 8 Ω branch gives 144/8=18 W; the smaller resistance has the larger power. Note that this conclusion depends on “the same voltage” (parallel); power can also be written as I²R, and if the current is the same instead (series), the conclusion reverses. ","If these two resistors (4 Ω and 8 Ω) are connected in series across the same 12 V source, which resistor dissipates more power? ","The 4 Ω resistor, because its power was larger in parallel","The 8 Ω resistor, because the series current is the same, P=I²R","Both are equal","Cannot be determined","Time constant τ=RC=5×0.2=1 s. V_C(t)=10(1−e^(−t/τ)); at t=τ, V_C=6.32 V (63.2% of the final value), and the final value is 10 V. The initial current is 10/5=2 A and decays as e^(−t/τ), because the higher the capacitor voltage, the smaller the resistor voltage 10−V_C. ","How many seconds does it take for the capacitor voltage to charge from 0 to 9 V (90% of the source voltage)? ","The capacitor starts at 8 V and discharges through 5 Ω, τ=RC=1 s, V_C(t)=8e^(−t/τ). The initial current is 8/5=1.6 A, leaving the positively charged plate and returning to the negative plate through the resistor; the capacitor's stored energy ½CV₀²=6.4 J is all converted to heat in the resistor. ","At t=2 s after discharging begins, what is the thermal power dissipated in the resistor, in W? ","Group A: τ=RC=4×0.25=1 s, V_C(t)=10(1−e^(−t/τ)), final value 10 V, initial current 10/4=2.5 A, decaying as e^(−t). ","In circuit A, what is the current at t=2 s, in A? ","Group B: R=8 Ω, C=0.125 F, τ=1 s, the same as Group A, so the V_C(t) curves coincide exactly; the initial current is 10/8=1.25 A, half of Group A's 2.5 A, and at every later time it is half of Group A's. The same time constant does not mean the same current. ","For Group B at t=1 s, how much electrical energy is stored in the capacitor, in J? ","By KVL, 10=i·R+V_C. The initial V_C=4 V, so the resistor has only 10−4=6 V across it, giving i₀=6/5=1.2 A, not 10/5=2 A. V_C(t)=10−6e^(−t/τ), τ=RC=1 s, and the final value of 10 V does not depend on the initial voltage. ","How many seconds does it take for the capacitor voltage to rise from 4 V to 7 V? ","τ=L/R=2/4=0.5 s, final current 8/4=2 A. Inductor voltage V_L=8e^(−t/τ): at t=0 the current is zero and there is no voltage drop across the resistor, so the full 8 V of the source is across the inductor; the inductor voltage is therefore largest then, and decays exponentially to zero afterward. ","At t=0.5 s (one time constant), what is the voltage across the inductor, in V? ","The L=2 H inductor carries an initial current of 1 A with a 4 Ω resistor, τ=L/R=0.5 s, i(t)=e^(−t/τ) A. The initial stored energy ½LI²=1 J is all turned into heat in the resistor. The inductor opposes sudden changes in current, so the current does not drop to zero instantly and its direction stays the same. ","At t=0.5 s, what is the thermal power dissipated in the resistor, in W? ","ω=1/√(LC)=1/√(0.7×0.18)=2.82 rad/s, period T=2π/ω=5.60 s. The total energy ½CV₀²=½×0.18×5²=2.25 J shifts back and forth between the electric and magnetic fields. When the capacitor voltage is zero the electric energy is zero, all 2.25 J becomes magnetic energy, and the inductor current is at its maximum. ","When the capacitor voltage first falls to zero, what is the current in the inductor, in A? ","The period T=2π√(LC)=5.60 s is determined only by L and C, not by the initial voltage. The initial total energy ½CV₀²=½×0.18×2.5²=0.5625 J is 1/4 of the previous example's 2.25 J (halving the voltage reduces the energy by the square). ","Keep the capacitance at 0.18 F and the initial voltage at 2.5 V, and increase the inductance from 0.7 H to 2.8 H (4 times). How do the period and the maximum inductor current change? ","Period doubles, maximum current is halved","Period quadruples, maximum current is halved","Period doubles, maximum current unchanged","Period unchanged, maximum current becomes 1/4","τ=RC=10×0.2=2 s (was 1 s), initial current 10/10=1 A (was 2 A), and the final value is still 10 V. R determines only how fast charging happens and the initial current, not the final value. ","At t=4 s after charging begins, what is the current in the resistor, in A? ","τ=RC=5×0.4=2 s (was 1 s). The initial current 10/5=2 A and the final value 10 V are both unchanged, but the capacitance is larger and the final charge Q=CV=4 C is twice the original 2 C; it has to charge more, so it is slower. ","After charging is complete, how much electrical energy is stored in the capacitor, in J? ","τ=RC=1000×10⁻⁶=1 ms, V_C(t)=10(1−e^(−t/τ)); at t=τ, V_C=6.32 V. After R is changed to 2 kΩ, τ=2 ms; the curve shape is unchanged but stretched horizontally by a factor of two, and the final value is still 10 V. The time scale is milliseconds, so the graph's horizontal axis should be in ms. ","After R is changed to 2 kΩ, how many ms does it take for the capacitor voltage to rise from 0 to 9 V? ","The two capacitors in parallel have the same voltage, with equivalent capacitance C=1+2=3 μF, τ=R·C=1 kΩ×3 μF=3 ms; the total current is i=(10 V/1 kΩ)e^(−t/τ)=10 mA·e^(−t/τ). Since i=C dV/dt and both capacitors have the same dV/dt, the current divides in proportion to capacitance: the 1 μF takes 1/3 and the 2 μF takes 2/3. ","At t=3 ms, what is the current in the 2 μF capacitor, in mA? ","E=12 V, internal resistance r=2 Ω, external resistance 10 Ω: I=E/(R+r)=1 A, terminal voltage U=E−Ir=10 V. When the external resistance decreases, the current increases, the voltage drop Ir across the internal resistance increases, and the terminal voltage falls. The slope of the U–I line is −r=−2 Ω, and the vertical intercept is the emf, 12 V. ","To make the voltage across the load equal 8 V, what should the load resistance be changed to, in Ω? ","With the switch open, the 4 Ω resistor is in series with the bulb, I=12/(4+8)=1 A, and the bulb power is P=I²R=8 W. When the bypass switch is closed, the bulb is shorted, the voltage across it is zero, and its power is zero; all 12 V is across the 4 Ω resistor, whose power actually increases. ","After the bypass switch is closed, what power does the 4 Ω resistor dissipate, in W? ","The current source fixes the total current at 1 A. The two resistors in parallel have the same voltage: parallel resistance 4×8/12=2.67 Ω, voltage 1×2.67=2.67 V; the 4 Ω branch carries 0.667 A and the 8 Ω branch 0.333 A, which sum to 1 A; current is inversely proportional to resistance. ","If the current source output is changed to 3 A, what is the voltage across the 8 Ω resistor, in V? ","Critical resistance 2√(L/C)=2√(0.1/10⁻⁵)=200 Ω. The present R=20 Ω is far below it, so the circuit is underdamped: it oscillates at an angular frequency of about 1000 rad/s (about 159 Hz), the resistor dissipates only a little energy each period, and the amplitude decays slowly. The larger R is, the faster the decay; at 200 Ω the oscillation just disappears. ","R is changed to 40 Ω (still underdamped). About how many ms does it take for the envelope of the capacitor voltage oscillation to decay to 1/e of its initial value? ","ωRC=2π×25×1000×10×10⁻⁶≈1.571. Capacitor voltage amplitude =5/√(1+(ωRC)²)=5/1.862≈2.69 V, phase lag arctan(ωRC)≈57.5°. The higher the frequency, the smaller the amplitude and the larger the lag (approaching 90°); the lower the frequency, the closer the capacitor voltage is to the source voltage. ","If the frequency is changed to 10 Hz, what is the steady-state amplitude of the capacitor voltage, in V? ","Unchanged. The line charge is inside the closed curve, so by Gauss's law ∮E·dA=Q_enc/ε₀="," (in units of λ₀/ε₀). Moving the charge or changing the curve to a square only changes the local contribution of each segment: the side near the charge has thicker lines and the far side thinner ones, but every field line passes out exactly once, so the total is unchanged. ","Change the source strength to −1.5 and change the closed curve to a square (still enclosing the charge). What is ∮E·dA, in λ₀/ε₀? ","The net flux is 0. When the charge is outside, the same field line enters on the side near the charge (orange) and exits on the other side (green), and the two cancel. The segment of curve nearest the charge has the largest |E·n̂|, so it is drawn thickest. ","Enlarge the closed curve until it just encloses the charge. What does the net electric flux become? ","Still 0","λ/ε₀ (1 λ₀/ε₀ in this example)","Depends on the shape of the curve","Infinite","When only +λ is enclosed, ∮E·dA="," λ₀/ε₀; when both ±λ are enclosed, Q_enc=0 and the net flux is 0. In the latter case E is not zero everywhere on the curve; the flux out simply equals the flux in. ","Change the source strength to 2, then move the curve so it encloses only −λ (the right-hand charge). What is ∮E·dA, in λ₀/ε₀? ","Magnetic field lines are closed: a field line leaving the N end returns to the N end through the inside of the magnet from the S end. For a closed surface around the N end, the flux leaving outside exactly equals the flux entering inside, so ∮B·dA=0. There is no separate “magnetic charge” that could act as a source of the magnetic field. ","Which of the following can make ∮B·dA nonzero? ","Enclose only the N end","Double the magnet strength","Shrink the curve to the inside of the magnet","None of the above","No difference; ∮E·dℓ is 0 in both cases. The electrostatic field is radial: along the loop, E·dℓ is positive on the stretch moving away from the charge and negative on the stretch approaching it, and the two cancel exactly. This is what “the electrostatic field is conservative” means, and it is why a potential can be defined. ","A unit positive charge goes once around this closed loop. How much work does the electrostatic force do? ","Depends on whether the loop encloses the charge","Depends on the shape of the loop","∮B·dℓ is determined only by the net current through the loop: when the wire is enclosed it is μ₀I="," (in units of μ₀I₀); after the wire is moved away it is 0, and changing to a square does not change it. B circles the wire, so every segment going counterclockwise contributes positively. ","Change the current to −1.5 I₀ (direction reversed), with the loop still enclosing the wire. What is ∮B·dℓ, in μ₀I₀? ","It equals −dΦB/dt. The loop is entirely inside the magnetic field region, with area πa²=",", dB/dt=",", so ∮E·dℓ=−",". The induced electric field lines close on themselves, with no start or end, which is completely different from the electrostatic field. ","Increase the curve radius to 2 (beyond the field region of radius 1.5). What is ∮E·dℓ, in B₀·u²/s? ","The small loop encloses "," of the 26 wires in the upper wall, each carrying current I₀/26, so ∮B·dℓ=μ₀I_enc="," μ₀I₀. The magnetic field of a solenoid (or bar magnet) is produced by these circulating currents, and Ampère's law holds for it equally. ","Move the loop center to the lower wall (y=−0.55), with the radius unchanged. What is ∮B·dℓ, in μ₀I₀? ","The same; both paths give ",". The work done by an electrostatic field is independent of path and depends only on the start and end points, so the potential difference between A and B can be defined: V_A−V_B="," (2D line charge: λ/(2πε₀)·ln(d_B/d_A)). ","Change the A→B angle to 240° (everything else unchanged). What is ∫E·dℓ along path 1? ","Different: path 1 gives ",", path 2 gives ",". Their difference is the ∮E·dℓ around the full loop =−dΦB/dt=−(dB/dt)·πρ²=",". The work depends on the path, so there is no unique potential difference between A and B. ","Change dB/dt to −0.5 (everything else unchanged). What is ∫₁E·dℓ − ∫₂E·dℓ? ","No, it is still 0. With the charge inside the loop, the field is stronger and the local contributions larger, but the electrostatic field is still conservative: going once around and returning to the starting point, the potential returns to its original value. The ∫E·dℓ along the two paths is still equal. ","With the charge inside the circle, a unit positive charge moves from A to B along path 1 and along path 2. The work done by the electrostatic force is: ","Equal","Greater along path 1","Greater along path 2","Depends on the sign of the charge","The induced electric field is not confined to the region where B≠0: for r>R, E=−R²(dB/dt)/(2r). The loop encloses the entire changing-field region, so ∮E·dℓ=−(dB/dt)πR²=",", independent of ρ. ","If ρ is increased from 2.4 to 3, ∫₁−∫₂ will: ","Increase","Decrease","Become zero","Consistent. The plane is pierced by the wire, with conduction current I_c=I; next to the wire B=μ₀I/(2πr), so ∮B·dℓ/μ₀=I. Ampère's original law has no problem here. ","At t=0, with loop radius r=",", what is the magnetic field B/μ₀ there, in A/m? ","The loop has not changed, so B on the loop and ∮B·dℓ are unchanged (still equal to I). But the pocket-shaped surface passes between the two plates, no wire passes through it, and Ampère's original law gives I_c=0 on the right-hand side. One loop gives two different answers, which shows the original law is incomplete. ","What determines the value of ∮B·dℓ? ","Only the magnetic field on the loop, independent of which surface is chosen","The chosen surface","The total length of the wire","The area of the plates","The electric field between the plates is increasing, and the electric flux ΦE through the pocket surface is changing. ε₀dΦE/dt is exactly equal to the current I in the wire (Q=ε₀ΦE, dQ/dt=I). With this term added, the right-hand side is I_c+I_d=0+I, which equals ∮B·dℓ/μ₀, and the contradiction disappears. ","The displacement current ε₀dΦE/dt through the pocket surface equals: ","The conduction current I in the wire","Half of I","The displacement current is uniformly distributed between the plates, and for r<R the loop encloses only the fraction r²/R²: ∮B·dℓ/μ₀=I·r²/R², so B=μ₀Ir/(2πR²)∝r. This is exactly the same as B∝r inside a thick wire with uniform current, except that “current” is replaced by displacement current. ","At t=0, change the loop radius to 1.0 (still between the plates, smaller than R=","). What is ∮B·dℓ/μ₀, in A? ","Electric field lines start on positive charges and end on negative charges (or extend to infinity). When there is no charge inside a closed surface, every field line enters and exits, and the net electric flux is 0, even though E on the surface is not zero. ","A closed surface contains +3q and −5q, with +10q outside it. What is the net electric flux through the surface? ","No. Cutting it gives two magnets, each with its own N and S poles. Magnetic field lines are always closed and there is no isolated magnetic charge, so the magnetic flux through any closed surface is zero: ∮B·dA=0. ","A bar magnet is cut in half through the middle. The result is: ","Both pieces each have an N pole and an S pole","One piece has only an N pole and the other only an S pole","Both pieces lose their magnetism","Only the longer piece is magnetic","When B points out of the screen and increases, the induced electric field is clockwise. If a conducting loop is placed there, the clockwise current produces a magnetic field pointing into the screen inside the loop, opposing the increase in flux; this is Lenz's law, and it is what the negative sign in Faraday's law expresses. ","In a circular region of radius 0.10 m, a uniform magnetic field increases at 2.0 T/s. Going once around the boundary of the region, what is |∮E·dℓ|, in V? ","A changing electric field. No charge flows between the plates of a charging capacitor, but the electric field is changing, and ε₀dΦE/dt plays the same role as a current (displacement current, extension), producing a circulating magnetic field around it in the same way. ","Besides current, which of the following can also produce a circulating magnetic field around it? ","A changing electric field between capacitor plates","A constant electric field","A stationary point charge","A uniform static magnetic field","A changing B produces a curling E (Faraday), and a changing E in turn produces a curling B (Ampère–Maxwell). Each is the source of the other, forming a self-sustaining disturbance that propagates forward at c=1/√(μ₀ε₀), with no need for charges or currents nearby. ","An electromagnetic wave of frequency 600 MHz (the order of mobile-phone signals) has what wavelength in vacuum, in m? ","LR / LC bench","Free-circuit bench","</div><div id=\"experiment\"></div><p class=\"link case-label\">Companion exploration · <a href=\""," · <a href=\"reference-figures.pdf\">MATLAB reference figures ↗</a>"];

const labLine=(x,y,u,v,color='#208069',extra='')=>'<line x1="'+x+'" y1="'+y+'" x2="'+u+'" y2="'+v+'" stroke="'+color+'" stroke-width="2" '+extra+'/>';
const labText=(x,y,s,color='#254640')=>'<text x="'+x+'" y="'+y+'" fill="'+color+'" font-size="14">'+s+'</text>';
const labDot=(x,y,r=5,c='#18745e')=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"/>';
const labArrow=(x,y,u,v,c='#208069')=>{
  const a=Math.atan2(v-y,u-x);
  return labLine(x,y,u,v,c)+labLine(u,v,u-8*Math.cos(a-.48),v-8*Math.sin(a-.48),c)+labLine(u,v,u-8*Math.cos(a+.48),v-8*Math.sin(a+.48),c);
};
const labPath=(pts,c='#18745e')=>'<polyline fill="none" stroke="'+c+'" stroke-width="2.6" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';
const labRect=(x,y,w,h,c)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2" fill="'+c+'"/>';
const labNum=(x,n=2)=>Number(x).toFixed(n);
const labChart=(fn,{x=52,y=45,w=570,h=220,min=-1,max=1,t,label='',axisEnd='t / T',color='#18745e'}={})=>{
  const pt=(p,q)=>[x+p*w,y+h*(max-q)/(max-min)];
  const axis=labLine(x,y,x,y+h,'#758981')+labLine(...pt(0,Math.max(min,Math.min(max,0))),...pt(1,Math.max(min,Math.min(max,0))),'#a3b7ad');
  const plot=labPath(Array.from({length:181},(_,i)=>pt(i/180,fn(i/180))),color);
  return axis+plot+labText(x,y-11,label)+labText(x+w-51,y+h+21,axisEnd)+(t==null?'':labDot(...pt(t,fn(t)),5,color));
};
const labParam=(name,min,max,step,value)=>({name,min,max,step,value});

function circuitSolve(branches,state={},dt=.004,instant=false,time=0) {
  const nodes=new Set(branches.flatMap(e=>[e.a,e.b]));
  const parent=Array.from({length:48},(_,i)=>i);
  const root=i=>parent[i]===i?i:(parent[i]=root(parent[i]));
  const union=(a,b)=>{const x=root(a),y=root(b);if(x!==y)parent[Math.max(x,y)]=Math.min(x,y);};
  branches.filter(e=>e.type==='W'||e.type==='S'&&e.value).forEach(e=>union(e.a,e.b));
  const roots=Object.fromEntries([...nodes].map(i=>[i,root(i)]));
  const active=branches.filter(e=>e.type!=='W'&&e.type!=='S');
  const sources=active.filter(e=>['V','A'].includes(e.type)||instant&&e.type==='C'&&roots[e.a]!==roots[e.b]);
  if(sources.some(e=>roots[e.a]===roots[e.b])) throw Error(_t(169,'理想电源的两端被短接。检查相应导线和开关。'));
  if(active.some(e=>e.type==='C'&&roots[e.a]===roots[e.b]&&Math.abs(state[e.id]?.v??e.initial)>1e-9))
    throw Error(_t(170,'带电电容被理想导线短接。可在放电路径中串联电阻。'));
  active.filter(e=>e.type!=='I'&&(!instant||e.type!=='L')).forEach(e=>union(roots[e.a],roots[e.b]));
  const offsets=new Map();
  for(const r of new Set(Object.values(roots))) if(r!==root(r)) offsets.set(r,offsets.size);
  const len=offsets.size+sources.length;
  const matrix=Array.from({length:len},()=>Array(len+1).fill(0));
  const at=i=>offsets.get(roots[i]);
  const stamp=(i,j,n)=>{if(i!==undefined&&j!==undefined)matrix[i][j]+=n;};
  const companion=e=>{
    const prior=state[e.id]??{v:e.type==='C'?e.initial:0,i:e.type==='L'?e.initial:0};
    if(e.type==='I')return [0,e.value];
    if(e.type==='C'){const g=2*e.value/dt;return [g,-g*prior.v-prior.i];}
    if(e.type==='L'){const g=instant?0:dt/(2*e.value);return [g,prior.i+g*prior.v];}
    return [1/e.value,0];
  };
  for(const e of active) {
    const a=at(e.a),b=at(e.b);
    if(sources.includes(e)){
      const k=offsets.size+sources.indexOf(e);
      stamp(a,k,1);stamp(b,k,-1);stamp(k,a,1);stamp(k,b,-1);
      matrix[k][len]=e.type==='V'?e.value:e.type==='A'?e.value*Math.sin(2*Math.PI*(e.frequency??1)*time):state[e.id]?.v??e.initial;
    }else{
      const [g,j]=companion(e);
      stamp(a,a,g);stamp(b,b,g);stamp(a,b,-g);stamp(b,a,-g);
      if(a!==undefined)matrix[a][len]-=j;
      if(b!==undefined)matrix[b][len]+=j;
    }
  }
  for(let k=0;k<len;k++){
    let pivot=k;
    for(let i=k+1;i<len;i++)if(Math.abs(matrix[i][k])>Math.abs(matrix[pivot][k]))pivot=i;
    if(Math.abs(matrix[pivot][k])<1e-12){
      if(instant&&sources.some(e=>e.type==='C')){
        const trial=circuitSolve(branches,state,dt/1000,false,time);
        for(const e of sources.filter(e=>e.type==='C')){
          const prior=state[e.id]?.v??e.initial,measured=trial.result[e.id].v;
          if(Math.abs(measured-prior)>1e-4*Math.max(1,Math.abs(prior)))
            throw Error(_t(171,'直接相连的电容初始电压不相容。请匹配初始电压，或加入串联电阻。'));
        }
        return trial;
      }
      throw Error(_t(172,'电路无法唯一求解。检查并联理想电源或闭合的纯电源回路。'));
    }
    [matrix[k],matrix[pivot]]=[matrix[pivot],matrix[k]];
    for(let i=k+1;i<len;i++){
      const f=matrix[i][k]/matrix[k][k];
      for(let j=k+1;j<=len;j++)matrix[i][j]-=f*matrix[k][j];
    }
  }
  const solution=Array(len);
  for(let i=len-1;i>=0;i--){
    let v=matrix[i][len];
    for(let j=i+1;j<len;j++)v-=matrix[i][j]*solution[j];
    solution[i]=v/matrix[i][i];
  }
  const voltage=Object.fromEntries([...nodes].map(i=>[i,solution[at(i)]??0]));
  const groups=Object.fromEntries([...nodes].map(i=>[i,root(roots[i])]));
  const result={};
  for(const e of branches){
    const v=groups[e.a]===groups[e.b]?voltage[e.a]-voltage[e.b]:null;

function thermoState(p,t,path=0){

    if(p.mode==='adiabatic'){pressure=P0*(V0/v)**(5/3);work=(P0*V0-pressure*v)/(2/3);}
    if(p.mode==='isobaric'){pressure=P0;work=P0*(v-V0);}
    if(p.mode==='isochoric')pressure=P0+(high-P0)*u;
  }else if(p.mode==='cycle'){
    const phase=u*4;
    if(phase<=1){pressure=P0+(high-P0)*phase;}
    else if(phase<=2){v=V0*(1+(ratio-1)*(phase-1));pressure=high;work=high*(v-V0);}
    else if(phase<=3){v=V0*ratio;pressure=high-(high-P0)*(phase-2);work=high*(v-V0);}
    else{v=V0*(ratio-(ratio-1)*(phase-3));pressure=P0;work=high*V0*(ratio-1)+P0*(v-V0*ratio);}
  }else{
    v=V0*(1+(ratio-1)*clamp(2*u-(path===0?1:0),0,1));
    pressure=P0+(high-P0)*clamp(2*u-(path===0?0:1),0,1);
    work=(path===0?high:P0)*(v-V0);
    if(p.mode==='reverse')work-=(path===0?high:P0)*V0*(ratio-1);

  const deltaU=1.5*(pressure*v-initialPV),heat=deltaU+work,temp=pressure*v/(.08*8.314);
  return {v,p:pressure,w:work,wBy:work,wOn:-work,u:deltaU,q:heat,T:temp};
}

const hiddenParam=(value,min=-3,max=3)=>({...labParam('',min,max,.01,value),hidden:true});
const axisFrame=(x,y,w,h)=>{
 let s='';for(let i=0;i<=10;i++)s+=labLine(x+i*w/10,y,x+i*w/10,y+h,'#e5ede7')+labLine(x,y+i*h/10,x+w,y+i*h/10,'#e5ede7');return s;
};
function electricSample(charges,x,y){
 let ex=0,ey=0,v=0;
 for(const c of charges){
  const dx=x-c.x,dy=y-c.y,r=Math.hypot(dx,dy);
  if(r<.06)return null;
  ex+=c.q*dx/r**3;ey+=c.q*dy/r**3;v+=c.q/r;
 }
 return {ex,ey,v};
}
function equipotentials(charges,map){
 let svg='';
 const size=.22,levels=[-3,-1.5,-.6,.6,1.5,3];
 for(let x=-2.8;x<2.8;x+=size)for(let y=-2.3;y<2.3;y+=size){
  const corners=[[x,y],[x+size,y],[x+size,y+size],[x,y+size]];
  const values=corners.map(c=>electricSample(charges,...c)?.v);
  if(values.some(v=>v===undefined))continue;
  for(const level of levels){
   const crossings=[];
   for(let k=0;k<4;k++){
    const j=(k+1)%4;
    if((values[k]<level)===(values[j]<level))continue;
    const t=(level-values[k])/(values[j]-values[k]);
    crossings.push(map(corners[k][0]+t*(corners[j][0]-corners[k][0]),corners[k][1]+t*(corners[j][1]-corners[k][1])));
   }
   if(crossings.length===2)svg+=labLine(...crossings[0],...crossings[1],level>0?'#97bfa6':'#dbad98',level<0?'stroke-dasharray="3 3"':'');
  }
 }
 return svg;
}

function textValue(value,p){return typeof value==='function'?value(p):value;}
function plotTick(value){if(value===0)return '0';const a=Math.abs(value);return a<.001||a>=100000?value.toExponential(2):String(Number(value.toPrecision(4)));}
const gaussFluxCache=new Map();
function gaussFlux(p){
 const key=[p.x,p.y,p.q,p.q0].join(',');if(gaussFluxCache.has(key))return gaussFluxCache.get(key);
 let plus=0,minus=0;const dt=Math.PI/120,df=2*Math.PI/240;
 for(let i=0;i<120;i++){const theta=(i+.5)*dt,st=Math.sin(theta),ct=Math.cos(theta);
  for(let j=0;j<240;j++){const phi=(j+.5)*df,x=st*Math.cos(phi),y=st*Math.sin(phi),r=Math.hypot(x-p.x,y-p.y,ct);
   const density=p.q*(1-p.x*x-p.y*y)/Math.max(r**3,1e-20)+p.q0;
   const contribution=density*st*dt*df/(4*Math.PI);if(contribution>0)plus+=contribution;else minus+=contribution;
  }
 }
 const result={plus,minus,net:plus+minus};if(gaussFluxCache.size>128)gaussFluxCache.clear();gaussFluxCache.set(key,result);return result;
}

// ----- Two kinds of electric field: path dependence -----
function twoFieldState(p){
 const A=[p.rho,0],th=p.ang*Math.PI/180,B=[p.rho*Math.cos(th),p.rho*Math.sin(th)];
 const staticE=(x,y)=>{const dx=x-p.qx,dy=y-p.qy,r2=Math.max(dx*dx+dy*dy,4e-4);return [p.q*dx/(2*Math.PI*r2),p.q*dy/(2*Math.PI*r2)];};
 const Ephi=r=>r<1e-9?0:-p.rate*Math.min(r,mxRegionR)**2/(2*r);
 const inducedE=(x,y)=>{const r=Math.hypot(x,y),f=Ephi(r)/Math.max(r,1e-6);return [-f*y,f*x];};
 const path=(E,from,to,n=1200)=>{let s=0;for(let j=0;j<n;j++){const a0=from+(to-from)*j/n,a1=from+(to-from)*(j+1)/n,am=(a0+a1)/2,x=p.rho*Math.cos(am),y=p.rho*Math.sin(am),[ex,ey]=E(x,y);s+=ex*p.rho*(Math.cos(a1)-Math.cos(a0))+ey*p.rho*(Math.sin(a1)-Math.sin(a0));}return s;};
 const s1=path(staticE,0,th),s2=path(staticE,0,th-2*Math.PI),i1=path(inducedE,0,th),i2=path(inducedE,0,th-2*Math.PI);
 const dA=Math.hypot(A[0]-p.qx,A[1]-p.qy),dB=Math.hypot(B[0]-p.qx,B[1]-p.qy);
 return {A,B,th,staticE,inducedE,s1,s2,i1,i2,vab:p.q/(2*Math.PI)*Math.log(dB/dA),emf:-p.rate*Math.PI*Math.min(p.rho,mxRegionR)**2};
}

// ----- Charging capacitor: Ampère–Maxwell -----
function dispState(p,t){
 const I=p.I0*Math.exp(-3*t),gap=Math.abs(p.xL)<.5,Rp=p.Rp,r=p.r;
 const Bloop=gap?I*Math.min(r,Rp)**2/Rp**2:I; // ∮B·dℓ/μ₀ from the actual field
 let Ic,Id;
 if(p.surface===0){Ic=gap?0:I;Id=gap?I*Math.min(r,Rp)**2/Rp**2:0;}
 else if(!gap){Ic=0;Id=I;} // bag bottom lies between the plates and catches all of the E flux
 else{Ic=I;Id=-I*(1-Math.min(r,Rp)**2/Rp**2);} // bag wraps the left plate and is crossed by the wire; E flux outside r crosses it backwards
 return {I,gap,Bloop,Ic,Id,B:r>0?Bloop/(2*Math.PI*r):0};
}
