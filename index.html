ressure. ","Two identical containers have the same volume and temperature; one holds 0.08 mol of helium (4 g/mol) and the other 0.08 mol of nitrogen (28 g/mol). Comparing their pressures: ","Helium has the higher pressure, because helium molecules are faster","Nitrogen has the higher pressure, because nitrogen molecules are more massive","They are equal, because n, V and T are all the same","Helium has the higher pressure, because its mean kinetic energy is larger","At constant temperature the molecular speed is unchanged. Halving the volume doubles the number density, so the number of collisions per unit wall area per unit time doubles and the pressure doubles, which is Boyle's law, PV=constant. Currently V="," L, P="," kPa; if V is increased to "," L, P drops to "," kPa. The impulse per collision does not change; the change in pressure comes entirely from the collision rate. ","Keep the temperature at "," K. For the pressure to drop to 80 kPa, what should the container volume be, in L? ","When the temperature rises, the peak of the distribution shifts toward higher speed: the most probable speed v_p=√(2RT/M)∝√T, rising from "," K ("," m/s) to "," m/s). The area under the curve is always 1 (total probability), so as the curve broadens its peak height drops (height ∝1/√T). The vertical line in the plot marks v_rms="," m/s, which is larger than v_p because the distribution has a long tail toward high speeds. ","Molar mass "," g/mol. If the temperature is changed to 300 K, what is the most probable speed v_p of the distribution, in m/s? ","Total energy of the insulated system is conserved: C₁(T₁−T)=C₂(T−T₂), so T=(C₁T₁+C₂T₂)/(C₁+C₂)="," °C. An object with a larger heat capacity changes temperature less, so the equilibrium temperature is closer to the initial temperature of object 2, which has the larger heat capacity, "," °C (object 2 rose by only "," K, object 1 fell by "," K). The heat transferred is |Q|="," J, Q₁+Q₂=0. ","Keep everything else the same and change only C₂ to 400 J/K. What is the equilibrium temperature in °C? ","When C₁=C₂ the weights are equal, T=(T₁+T₂)/2="," °C, the arithmetic mean. Physically, both objects absorb or release the same heat per 1 K change, so whatever one drops the other rises, and the temperature difference is split equally. The heat transferred is |Q|=","Keep C₁=C₂="," J/K, T₂="," °C and change T₁ to 100 °C. How much heat is transferred from object 1 to object 2, in J? ","Heat flows only when there is a temperature difference; the heat flow is G(T₁−T₂)=10×(",")=0. Both objects start at "," °C and are already in thermal equilibrium; different heat capacities cannot produce a net heat flow, and T stays at "," °C, Q₁=Q₂=0. Heat capacity only determines “how much heat is needed for the same temperature change”, not the direction of heat flow. ","Objects 1 and 2 both start at 50 °C, but C₁=100 J/K and C₂=300 J/K. After contact: ","Heat flows from the object with the larger heat capacity to the one with the smaller heat capacity","Heat flows from the object with the smaller heat capacity to the one with the larger heat capacity","There is no net heat flow, and both objects stay at 50 °C","The final temperature is the heat-capacity-weighted value, above 50 °C","Energy conservation C₁(T₁−T)=C₂(T−T₂) gives C₁=C₂(T−T₂)/(T₁−T). In this example T="," °C: C₁="," J/K, consistent with the slider value. The closer the equilibrium temperature is to T₁, the larger the heat capacity of object 1. ","Given T₁=80 °C, T₂=20 °C, C₂=200 J/K, and a measured equilibrium temperature of 44 °C. Find C₁ (J/K). ","On the perpendicular bisector of a dipole, every point is equidistant from +q and −q, so the scalar potentials kq/r cancel exactly and V=0; but the electric field is a vector: the components of the two charges' fields along the bisector are opposite and cancel, while the components parallel to the dipole axis add in the same direction. With the probe at (","), E=(","), directed from +q to −q, |E|=",". So E is generally not 0 where V=0. ","The probe moves along the perpendicular bisector to (0, 1.6) (same units as the coordinates). What is the field magnitude |E| here (in units of kq₀/length²)? ","kq₀/length²","The fields of two like charges cancel between them. At the midpoint (0, 0) of the line joining them, the two fields are equal in magnitude and opposite in direction, so E=0; moving off the midpoint along the perpendicular bisector, the horizontal components still cancel but the vertical components add in the same direction. For example, at the probe's current position (0, ","), E=(","). The potential at this point is not zero but V="," (two positive potentials add). So a point with E=0 can have a large potential: E depends on the slope of the potential, not on its value. ","The two charges are separated by "," (along the line joining them). Change q₁ to +4 q₀ and keep q₂ at +1 q₀. How far from q₁ is the point on the line where E=0 (same units)? ","Without q₃, the fields of the two equal like charges at the midpoint (0, 0) of the line joining them are equal in magnitude and opposite in direction, E=(","), an equilibrium point. After adding q₃=+1 (located at (0, 1.4)), the total field at the origin = the original field + the field of q₃ = (","), pointing along −y and no longer zero, so the original equilibrium point no longer holds. The new E=0 point shifts along the perpendicular bisector to the side away from q₃ (y<0); the potential at the origin is also raised by q₃ to V=","E=0 at the midpoint of the line joining two equal like charges. After a third charge q₃ is placed on the perpendicular bisector (not coinciding with them), at the original E=0 point: ","E is still zero, because the original two fields still cancel","E is no longer zero; the field there equals the field produced by q₃ alone","E is no longer zero, but it stays zero as long as q₃ is smaller than the original charges","E is zero if and only if the potential at that point is zero","The probe is the same distance from both charges (r=","), so the readings can be decomposed directly: V=(q₁+q₂)/r gives q₁+q₂=Vr=","; the horizontal field Eₓ=(q₁−q₂)×"," gives q₁−q₂=",". Solving together gives q₁=",", q₂=",", so |q₁| is larger. When the distances differ, compare using E∝q/r²: the charge farther away needs a larger |q| to produce the same field. ","Keep q₁=",", with the probe unmoved. For the probe's Eₓ to increase to 2.0 (in kq₀/length² units), what should q₂ be, in q₀? ","A positive charge feels a force qE="," (along +y); it moves uniformly horizontally and accelerates uniformly vertically, and the electric force does positive work, increasing the kinetic energy. As the speed increases the potential energy must decrease: U=−qEy falls from 0 to ",", and K goes from "," up to "," (animated up to t=","), and K+U stays constant at ",", so mechanical energy (kinetic plus potential) is conserved. ","Change E to 1.2 (m=1, q=+1). When the particle is displaced 0.5 (normalized length) along the field, by how much has its kinetic energy increased? ","A negative charge feels a force qE=",", pointing along −y, i.e. deflecting toward the + plate. Force and displacement are in the same direction, so the electric force still does positive work and the kinetic energy increases: K goes from ",", and the potential energy U falls from 0 to ",", with K+U staying at ",". The potential energy falls when the charge moves “along the direction of the force”, regardless of the sign of the charge. The vertical velocity is vy="," (downward). ","A positive and a negative charge (equal magnitude of charge, same mass) enter the same field with the same initial velocity, and each is deflected to 0.5 from the entry line. Compare their kinetic energies at that point: ","The positive charge has more kinetic energy, because it moves along the field","The negative charge has more kinetic energy, because it feels a larger force","They are equal, because the work done by the force over the displacement is |q|E×0.5 for both","The negative charge's kinetic energy decreases, because it moves against the field","The deflection is set by uniform vertical acceleration: the flight time between the plates is t=L/vₓ (plate length taken as 3 units), and the exit displacement is y=½(qE/m)(L/vₓ)²∝1/vₓ². The faster the particle, the less time it spends between the plates, and its vertical velocity and displacement have no time to grow. In this example t=",", y=",", vy=","; if vₓ=1.2, then t=2.5 and y would be ",", which already exceeds the plate separation, so the particle would hit the plate. Hence a large vₓ gives a small deflection. ","With the other parameters unchanged (q=+1, E=0.7), the entry speed is changed from 1.9 to 1.6. The particle's exit displacement between the plates becomes how many times the original? ","times","With mass 1 and q=+1, y=½Et², so E=2y/t², where t=x/vₓ is the horizontal flight time (x is the horizontal distance traveled). In this example the particle hits the plate at t=",", where y=",", E=2×",", which matches the set E=",". In an experiment, measuring the horizontal position gives t and measuring the vertical displacement gives y, so you can work backward to the field strength. ","q=+1, m=1. The particle is measured to be displaced y=0.9 along the field at t=1.5 (computed from the horizontal position x=vₓt). Find E. ","The electrostatic force is conservative, and the potential difference is ΔV=V(B)−V(A)=Q/rB−Q/rA="," depends only on the positions of the two endpoints and not on the path, so the straight path and the polyline read the same at the end. The work done by the field on the test charge q="," is W=−qΔV=",": the repelled positive charge approaches Q, the field does negative work, and the potential energy rises by ΔU=",". The two curves differ in between, but the endpoints must coincide. ","Keep everything else the same and change the endpoint rB to 0.8. What is the change ΔU in the test charge's potential energy (normalized units)? ","A longer path does not change the total work. The potential difference between the endpoints is still ΔV=",", W=−qΔV=",", exactly the same as for the straight path. But the cumulative work in between rises and falls: in the first segment A→D the charge moves away from Q (r increases from "," to ","), and the field does positive work on the positive charge: ",", and later, when approaching Q, it does negative work; the total is determined by the endpoint potentials. Work depends only on the starting and ending values of r, not on how far the charge travels. ","The first polyline segment A→D moves vertically upward, and the field at the starting point A is horizontal (radial). The test charge q>0 and Q>0. The sign of the work done by the field on this segment is: ","Zero, because the displacement is perpendicular to the field at A","Negative, because the electric force always opposes the motion","Positive, because this segment increases r and the field has an upward component along the way","The sign depends on the height of the polyline","ΔV is a property of the source, depending only on Q and the start and end positions, and does not change with the sign of the test charge: ΔV is still ",". Every quantity that depends on the test charge flips sign: the change in potential energy is ΔU=qΔV=",", and the work done by the field is W=−ΔU=",". The negative test charge is attracted by Q; when it approaches, the field does positive work and the potential energy decreases. ","Keep the test charge q=−1 and change the source charge to Q=+2 (rA="," and rB="," unchanged). How much work does the field do on the test charge (normalized units)? ","When rA=rB the two endpoints are on the same equipotential surface, ΔV=0, and the total work is zero. But this does not mean no work is done on every small segment along the way: the field is perpendicular to the displacement only when moving along an equipotential line (an arc centered on Q). In this example the polyline first leaves the equipotential surface vertically, and the cumulative work at the highest point is ",", then on returning it does the opposite work, and the total is zero. For the straight path the start is the end, the displacement is zero, and the work is naturally zero. ","Everything else unchanged (rA=rB=","), change the polyline height to 1.8. What is the cumulative field work at the highest point of the polyline (normalized units)? ","First decide which quantity is constrained: with the source connected, V is fixed (Q can change); when disconnected, Q is fixed (V can change). Pulling the plate separation to d=","d₀ (C=","C₀): connected to the source, V=V₀ and E=V/d falls to ","E₀, charge flows back to the source, Q=","Q₀, and the stored energy U=","U₀ decreases; when disconnected, Q=Q₀ and E=σ/ε₀ is unchanged (","E₀), and V rises to ","V₀ and the stored energy increases to ","U₀. Pulling the plates apart requires work against the attraction (external work ","U₀ for the disconnected case). ","A disconnected capacitor (κ=1) has its plate separation pulled to d=2.5d₀. The external work done is how many times U₀? ","Inserting a dielectric increases C to ","C₀. Connected to the source: V is fixed and the plate separation is unchanged, so E=V/d is unchanged; C increases, so the source must supply additional charge ΔQ=(","−1)Q₀, the source supplies energy ","U₀, and the stored energy rises to ","U₀. Disconnected: Q is unchanged, V falls to ","V₀, and E falls to ","E₀ (weakened inside the dielectric by bound charge); the source exchanges no charge, and the stored energy falls to ","U₀. ","After the capacitor is disconnected from the source, a dielectric slab is slowly pushed between the plates. The sign of the work done by the external force is: ","Positive, because the external force pushes the dielectric in","Zero, because no source is involved","Negative, because the field pulls the dielectric in and the stored energy decreases","It depends on how fast the slab is pushed in","Energy conservation ΔU=W_source+W_ext. Connected to the source: the stored energy goes from U₀ to ","U₀, ΔU=","U₀; the charge flows back and the source supplies energy ","U₀ (the source absorbs energy), so the external work is ","U₀. Check: ",". Disconnected: the source supplies 0 energy, ΔU=","U₀ comes entirely from the external work ","A capacitor connected to the source (κ=1) has its plate separation pulled from d₀ to 1.6d₀. The energy absorbed (recovered) by the source is how many times U₀? ","Capacitance C=κ/d=","C₀ is back to its initial value, so the charge Q and voltage V both return to Q₀ and V₀ under both conditions, and the stored energy returns to U₀. But the field does not recover at the same time: the plate separation is "," times the original, and E=V/d falls to ","E₀ (in the disconnected case E=V/d is likewise ","E₀). Equal capacitance only shows that κ/d is the same, not that d or E is the same. ","Plate separation d=","d₀. For the capacitance to be 1.5 times its initial value, what dielectric constant κ is needed? ","In series the middle conductor is isolated, and charge can only transfer from one plate to another, so the two capacitors carry equal charge Q="," μC. The voltage is set by V=Q/C, and the smaller capacitance has the larger voltage: V₁="," V, V₂="," V, which sum to the source voltage "," V. Ceq="," μF, smaller than either capacitor. ","Keep everything else the same and change C₂ to 12 μF. What is the voltage across C₁, in V? ","In parallel both capacitors have a voltage equal to the source voltage "," V, and the charge is set by Q=CV, proportional to capacitance: Q₁="," μC, Q₂="," μC, ratio 1:",". The total charge is "," μC, and dividing by the voltage gives Ceq=Q/V="," μF=C₁+C₂, consistent with direct addition. ","Two capacitors in parallel are connected to a source of fixed voltage. If the value of C₂ is doubled (C₁ unchanged), the charge on C₁: ","doubles, because the total capacitance increased","is halved, because the charge is shared with C₂","stays the same, because the voltage across C₁ still equals the source voltage","becomes 3/2 of the original","For series 1/Ceq=1/C₁+1/C₂; setting Ceq=2 μF gives 1/C₂=1/2−1/",", C₂="," μF. Then Q="," μC, V₁="," V. Note that in this case the initial C₂="," μF gives Ceq="," μF, so C₂ must be reduced to bring it down to 2 μF. ","Keep C₁="," μF. For the series equivalent capacitance to be 2.4 μF, to what value in μF should C₂ be adjusted? ","Stored energy U=½CeqV². At the same voltage, stored energy is proportional to Ceq. Parallel Ceq="," μF corresponds to "," μJ, and series Ceq="," μF gives only "," μJ, so the energy stored in parallel is "," times that in series. In parallel each capacitor has the full voltage across it, while in series the voltage is shared, so parallel stores more. ","At the same source voltage, if C₁=4 μF and C₂=12 μF, the energy stored in parallel is how many times that stored in series? ","R=ρL/A, where ρ and A are unchanged, so R∝L, a straight line through the origin. Currently ρ="," μΩ·m, r="," mm (A="," mm²): L=0.5 m gives R="," Ω; L="," m gives R="," Ω; L=2 m gives R="," Ω. Doubling the length doubles the resistance. At fixed voltage, I=V/R is inversely proportional to L. ","Keep r, ρ and the terminal voltage "," V unchanged, and change the wire length to 2.4 m. What is the current in A? ","Resistance is inversely proportional to cross-sectional area, A=πr². The radius is doubled from 0.3 mm to "," mm, the area becomes 4 times, and the resistance becomes 1/4: R drops from "," Ω to "," Ω. You cannot assume the resistance halves just because “the radius doubles”, nor ignore the square law. At the same voltage the current increases to 4 times the original. ","Compared with the original wire (L=1 m, r=0.3 mm), if L is doubled to 2 m and r is also doubled to 0.6 mm, the resistance becomes: ","4 times","Unchanged","From the measurement R=V/I="," Ω, then use ρ=RA/L: A=π(0.3×10⁻³)²=","×10⁻⁷ m², ρ="," μΩ·m. Unit conversion (mm→m) is the easiest place to make a mistake. ","The same wire (L="," m, r="," mm) carries a current of 0.4 A at a terminal voltage of 1 V. What is the resistivity of the material in μΩ·m? ","To keep R=ρL/(πr²) unchanged after L doubles, A must also double, so r must increase by a factor of √2: 0.3×√2=0.424 mm. Check: with L="," m, r="," mm, R="," Ω, the same as the original value for L=1 m, r=0.3 mm: "," Ω. When the length doubles, doubling the radius only would cut the resistance to half of the original, which over-compensates. ","If the wire is made twice as long with the same resistance (the cross-sectional area doubles accordingly), the volume of metal in the wire (V=AL) becomes how many times the original? ","2 times","Every charge element on the ring is the same distance from the point on the axis, r=√(R²+z²), so r in V=∫k dq/r can be taken outside the integral: V=kQ/√(R²+z²) (only ∫dq=Q remains). At z="," R, V="," kQ/R. Potential is a scalar and has no direction to track, so for the ring the discrete sum and the integral agree exactly for any number of segments (relative error 0). ","For a point on the ring's axis with z changed to 1.5R, what is the potential V in units of kQ/R? ","Points on the rod are at different distances, so integrate dq/r: V=kQ/(2L)·∫du/√(u²+z²)=asinh(L/z) (L is the half-length of the rod). With z=","R, the integral value is ",". The discrete sum uses the midpoint rule: at n=",", it gives ",", a relative error of ","%; at n=",", the error drops to ","%. The midpoint-rule error ∝1/n², so doubling the number of segments cuts the error to about 1/4, approaching the continuous integral. ","On the perpendicular bisector of the rod, z=","R. When the number of segments is increased from "," to ",", the relative error of the discrete sum is about: ","reduced to about 1/2","reduced to about 1/4","roughly unchanged","reduced to about 1/24, because there are 2 times as many segments","The ring's potential is V=kQ/√(R²+z²). For z≫R, √(R²+z²)→z, so from far away the ring looks like a point charge, V→kQ/z. At z=","R, the ring has V="," kQ/R and the point charge has V="," kQ/R, a difference of ","%. The larger z is, the smaller the difference, about R²/(2z²). ","At z=3R on the ring's axis (the slider's upper limit), the ring's potential is lower than that of a point charge with the same charge at the same position by what percentage? ","In the near field, z=","R, the distances from the segments to the probe vary greatly (the nearest segment is only ","R away, the farthest ","R), and 1/r is not constant within each segment, so the midpoint approximation has a large error: for n=",", the relative error is ","%. The number of segments must be increased to n="," to bring the error below 1% (error ","%). The closer to the rod, the more segments are needed. ","Keep n="," and move the probe from z=","R to z=0.8R. What is the relative error of the discrete sum, in %? ","V=Q/x (normalized). The electric field points in the direction in which the potential decreases fastest, Eₓ=−dV/dx. At present x=",", V=",", dV/dx=−Q/x²=","<0 (V decreases as x increases), so Eₓ=",">0: the electric field points along +x, toward the side of lower potential. ",", change the position to x=1.25. What is Eₓ (in normalized units)? ","For Q=−1, V=Q/x=","<0, but the field direction is not set by the sign of V; it is set by the slope: dV/dx=−Q/x²="," (V rises toward 0 as x increases), so Eₓ=−dV/dx=","<0: the field points along −x, toward the source charge. Where the potential is negative the field can be negative or positive, depending on the slope; the choice of potential zero does not change E. ","For a one-dimensional potential V(x) along the x axis, which statement about the field component Eₓ is correct? ","Eₓ must be negative wherever V is negative","Eₓ is determined by the sign and magnitude of the slope of the V(x) curve, independent of the sign of V itself and of the choice of potential zero","The electric field always points toward the side of higher potential","The larger the magnitude of V, the larger Eₓ","For V=Q/x, the magnitude of the slope dV/dx=−Q/x² decreases as x increases, inversely proportional to x²; that is, the curve is flatter farther away. At x=",", |Eₓ|=",", whereas at x=2 it is 0.250, reduced to "," times the original. So where the potential curve flattens, the field is weaker. ",". When x is changed from 4.5 to 3.0, the magnitude of the tangent slope is how many times its value at x=4.5? ","Decompose the initial velocity: v⊥=",", v∥=",". The magnetic force F=qv×B depends only on v⊥, so r=mv⊥/(|q|B)="," and the period T=2πm/(|q|B)="," are both independent of v∥. v∥ experiences no force and stays constant; it only sets the distance advanced along B per revolution, the pitch v∥T=",". So when only the parallel component is changed, the radius stays the same and the pitch changes linearly. ","Keep the angle between the velocity and B at ","°, B=",", and m and |q| unchanged, and change the speed v to 1.5. What is the pitch (distance advanced along B per revolution, in relative units)? ","For perpendicular incidence, v is entirely v⊥, and F=qv×B is always perpendicular to v, so the magnetic force does no work on the particle (F·v=0); it only changes the direction of the velocity, and the speed stays ",". For a positive charge with B along +z, the force points along v×B and always toward the center, providing the centripetal force qvB=mv²/r, which gives r=",", with no drift along B; the orbit is a planar circle. ","All else unchanged, if the entry speed is halved, how does the period of one trip around the circle change? ","It becomes half the original","It stays the same","It becomes twice the original","It becomes one quarter of the original","The force direction is set by qv×B. Reversing q reverses the force, but its magnitude |q|vB is unchanged, so r="," and T are exactly the same as for q>0; only the sense of rotation is opposite. By the right-hand rule, a positive charge rotates opposite to the right-hand screw sense (thumb along B), and a negative charge rotates the same way as it; viewed head-on along B (B pointing toward the observer), a negative charge goes counterclockwise and a positive charge clockwise. v∥="," is independent of the sign of the charge, and the particle still advances along +z. ","In this case the charge is negative, q=−1, and B points along +z. Viewed head-on from the +z end (B pointing toward the observer), what are the sense of rotation of the particle's projection and its motion along z? ","Clockwise, advancing along +z","Counterclockwise, advancing along +z","Counterclockwise, advancing along −z","Clockwise, advancing along −z","When v is parallel to B (angle 0°), v×B=0 and the magnetic force F=qvB sin0°=0, so the particle feels no force and, although the field is nonzero, it keeps moving in a straight line at constant speed: v⊥=0, radius r=0, and it advances along z at v∥=",". The magnetic field acts only on the velocity component perpendicular to B, which is also why v∥ stays constant in general helical motion. ","Change the angle to 40° with everything else unchanged (v=",", B=",", m and |q| unchanged). What is the orbit radius r (in relative units)? ","For perpendicular incidence, r=mv⊥/(|q|B), so conversely |q|/m=v⊥/(rB). In this task the measured r≈",", v⊥=",", so |q|/m=",". Note that only the ratio |q|/m can be determined, not q and m separately; repeating the measurement with different B tests r∝1/B. ","Using the |q|/m measured above, if B is changed to 0.8 (v⊥ still ","), what should the orbit radius r of this unknown particle be (in relative units)? ","By Ampère's law, B·2πr=μ₀I, so B=μ₀I/(2πr)=2×10⁻⁷×"," T ("," μT). When the current is positive (⊙, out of the screen), B circulates counterclockwise around the wire by the right-hand rule. The field magnitude is inversely proportional to r, so the curve falls off quickly with distance. ","Keeping the wire position unchanged, change the current to 15 A and the probe distance to 5 cm. What is the magnitude of the field at that point, in μT? ","First find the field of wire 1 at wire 2: B₁=μ₀I₁/(2πd)=2×10⁻⁷×"," T. The force per meter on wire 2 is F/L=I₂B₁="," N/m. Direction: the field of wire 1 at wire 2 points up and I₂ points out, ẑ×ŷ=−x̂, toward wire 1, so currents in the same direction attract (by Newton's third law, wire 1 also feels a force of equal magnitude in the opposite direction). ","Keep I₁=10 A, change I₂ to 16 A and the separation to 0.05 m. What is the force per meter on wire 2, in mN/m? ","The magnitude and direction of B₁ at wire 2 have not changed (upward, "," T); only I₂ now points into the screen (−ẑ). The direction of the force F=I₂ℓ×B₁ therefore reverses: (−ẑ)×ŷ=+x̂, away from wire 1, so currents in opposite directions repel. The magnitude is still |I₂|B₁="," N/m, and wire 1 is likewise pushed to the left. ","Starting from this case (I₁=10 A, I₂=−10 A), now also change I₁ to −10 A. What happens to the force between the two wires? ","Repel, twice the original magnitude","Repel, same magnitude","Attract, same magnitude","No force, because both currents are reversed and cancel","Take ℓ along the current direction, F=Iℓ×B. The current direction is (cos","°), B is along +x, and the z component of ℓ×B is −ℓ sinθ·B. Since I>0 and sinθ>0, Fz is negative and the magnetic force points into the screen (⊗). Magnitude |F|=IℓB sinθ="," N. ","Keep I=2 A and change the wire direction to θ=−60° (the current has a downward component). What is the direction of the magnetic force? ","Into the screen","Out of the screen","Zero force","Along the wire","When the current is parallel to the field, the magnitude of Iℓ×B is IℓB sinθ with θ=0°, sinθ=0, so the magnetic force is zero. The magnetic force comes only from the component of the current perpendicular to B (Iℓ sinθ); the component along B feels no force. Even though I="," A, B="," T are both nonzero, there is still no magnetic force; this is the same reason the Lorentz force is zero on a charge moving parallel to B. ","Keep I="," T, ℓ="," m and change the angle to 40°. What is the magnitude of the magnetic force, in N? ","Reversing the current is equivalent to ℓ→−ℓ, so F=Iℓ×B changes sign overall: originally I=+2 A gave a force into the screen; now I="," A, Fz="," N, so the force now points out of the screen (⊙). The magnitude |F|="," N is unchanged. Changing the current direction or the direction of B only flips the direction of the force. ","At I=−2 A and B=0.5 T, change the wire angle to θ=−30° and the effective length to 1.4 m. Find Fz (out of the screen is positive, in N). ","|F|=IℓB|sinθ|. When only θ varies, I, ℓ and B are fixed, so |F| varies with |sinθ|. At θ=","°, |F|="," N. When the wire is perpendicular to B (θ=±90°), |sinθ|=1 and the magnetic force is at its maximum, |F|max=IℓB="," N. At θ=+90°, Fz<0 (into the screen); at θ=−90°, Fz>0 (out of the screen). ","Keep I=2 A (positive). To make the magnetic force point out of the screen and be maximum, the angle θ between the wire and B should be set to: ","U=−μB cosθ has its minimum −μB="," J at θ=0° (μ along B), which is the stable equilibrium. Now θ=","°, U="," J, τz=−μB sinθ="," N·m, which is negative; the torque decreases θ and pulls μ back toward the direction of B. When displaced to the other side, τz is positive and again points back toward θ=0°. So after any displacement the torque is always restoring. ","Keep θ=65°, change the magnetic moment to 1.6 A·m² and the field to 1.5 T. What is the torque magnitude |τ|, in N·m? ","At θ=180°, τz=−μB sin180°=0, so it is an equilibrium point; but here U=+μB is the maximum ("," J). If slightly displaced to 180°+δ, τz=+μB sinδ, and the torque drives the angle further from 180° instead of pulling it back, so this is an unstable equilibrium. Whether an equilibrium is stable depends not on the torque being zero but on the direction of the torque after a displacement (equivalent to whether the U curve has a maximum or a minimum at that point). ","The magnetic moment is initially exactly antiparallel to B (θ=180°). After a tiny perturbation, what happens without damping? ","It returns to θ=180° and stays there","It leaves 180°, turns toward θ=0° and oscillates about 0°","It stays at the perturbed position","It keeps rotating in the same direction","For quasi-static rotation the kinetic energy does not change, and the work done by the external agent equals the increase in potential energy: W=U(θ)−U(0)=−μB cosθ−(−μB)=μB(1−cosθ). At θ=90°, cos90°=0 and W=μB="," J. This is the work done by the external agent against the magnetic torque, stored as the potential energy of the magnetic dipole; the work done by the field on the moment is −W. ","Now use μ=1.5 A·m² and B=0.8 T. How much work, in J, does the external agent do in slowly turning the moment from θ=0° to θ=120°? ","The flux through a single turn is Φ=B×overlap area. The entering stage (overlap area growing from 0 to 1 m²) lasts 1/v="," s, during which Φ increases linearly by "," Wb, ε=−NdΦ/dt="," V, I=ε/R="," A (negative means clockwise); when the coil is fully inside the field Φ is constant and ε=0; during the exit stage Φ decreases linearly and ε=+"," V (counterclockwise). The emf is set by the slope of the flux, not by the size of the flux. ","With N=5 turns, B=1.6 T and v=1.5 m/s, what is the magnitude of the induced emf while the coil enters the field, in V? ","When the speed doubles, the flux change per stage ΔΦ=B×1 m² is unchanged, but the time is shortened from 1 s to 1/v="," s, so dΦ/dt, the emf and the current all double: |ε|=NBv="," V, |I|="," A. On the same physical time axis the waveform becomes narrower and taller; the area under the curve ∫ε dt=NΔΦ is unchanged. ","With N=3, B=1 T and R=4 Ω, if the speed is changed to 0.5 m/s, how much Joule heat (in J) is produced while the coil moves completely into the field? ","After B is reversed, the single-turn flux Φ becomes negative and dΦ/dt also reverses, so the Φ, ε and I curves are all flipped upside down, while the overlap area and the duration of each stage are unchanged. In the entering stage ε=−NdΦ/dt=+"," V, so the current becomes counterclockwise; in the exit stage ε="," V (negative) and the current is clockwise. The magnitude |ε|=N|B|v="," V is unchanged; it is still zero when the coil is fully inside. ","In this case the field points into the screen (B=−1 T). When the coil is leaving the field, what is the current direction? ","No current","Clockwise first, then counterclockwise","In the entering stage ε="," V lasting "," s, the signed area under the curve is ∫ε dt="," V·s, equal to −NΔΦ. So ΔΦ (per turn) = −area/N="," Wb, exactly B×1 m². Integrating ε over time and dividing by −N recovers the flux change; the absolute zero of the flux must come from knowing that Φ=0 when the coil is entirely outside. ","With N=5, B=1.6 T and the speed changed to 0.5 m/s, what is the magnitude of the area under the ε curve during the entering stage, in V·s? ","The emf is ε=Bℓv="," V, the current is I=ε/R="," A, and the rod feels a magnetic drag force F=BIℓ="," N; at constant speed the applied force must equal it, giving a pulling power Fv="," W. The Joule heating power is I²R="," W; the two are equal: the heat in the resistor comes from the work done by the external force, and the magnetic field itself supplies no energy. ","If the pulling speed is changed to 1.6 m/s (all else unchanged, B="," T, ℓ="," m, R="," Ω), what pulling power is required, in W? ","After the pulling force is removed, the magnetic drag F=B²ℓ²v/R slows the rod: m dv/dt=−B²ℓ²v/R, so the speed decays as v=v₀e^(−t/τ) with τ=mR/(B²ℓ²)="," s (rod mass taken as 0.5 kg). As v decreases, ε, I and F also decrease, so the deceleration gets slower and slower. The kinetic energy "," J is entirely converted to Joule heat; at any moment, kinetic energy + accumulated heat stays constant. ","In this case the rod mass is 0.5 kg. When the rod's speed has dropped to 0.5 m/s, how much Joule heat (in J) has accumulated in the resistor? ","When the resistance is smaller, the same ε=Bℓv drives a larger current: I=ε/R="," A (only "," A at R=2 Ω). A larger current gives a larger magnetic drag B²ℓ²v/R and stronger damping: the decay rate is 1/τ=B²ℓ²/(mR)="," s⁻¹, so the rod stops sooner. The smaller R is, the larger the initial current and the faster the deceleration; the larger R is, the closer the rod comes to coasting at constant speed. ","If the circuit is changed to an open circuit (R→∞, no current path), how does the rod move on the rails? ","It stops immediately","It coasts at constant speed; the open-circuit emf still exists but there is no magnetic drag","It decelerates exponentially, just as with a resistor","It accelerates","In an open circuit, ε=Bℓv="," V still exists (the Lorentz force separates charges within the rod, building up a potential difference across the gap), but with no closed circuit I=0, so there is no magnetic drag and the rod keeps its speed. Conversely, B=ε/(ℓv)="," T, which is how a magnetic field is measured from an open-circuit voltage. ","In another measurement, the rod is 1.2 m long, the speed is 1.0 m/s, and the open-circuit emf is 0.72 V. What is the field B, in T? ","Divide the ring into many current elements; the dB each produces on the axis is perpendicular to the line from the element to the field point. For two opposite elements on the ring, the components perpendicular to the axis are equal in magnitude and opposite in direction and cancel, leaving only the axial component. Integrating gives Bz=μ₀IR²/[2(R²+z²)^(3/2)], which in normalized form is 1/(1+z²)^(3/2). At z=",", Bz=",", smaller than the maximum value 1 at the center of the ring; the curve is symmetric about z=0. ","For the same ring, move the probe to z=1.5R. What is the normalized Bz (in units of μ₀I/(2R))? ","Treat the solenoid as N rings arranged along the axis; the axial field is the superposition of the fields of the rings. For N=",", ℓ=","R: center Bz=",", end face (z=ℓ/2) Bz="," (about ","% of the center), and at 1.5R beyond the end face Bz=",". The field falls off continuously at the end rather than dropping to zero abruptly, because the nearer to the end, the fewer rings are superposed on the outer side. ","Moving along the axis from the solenoid's center to its end face (z=ℓ/2), how does the field compare with that at the center? ","It drops abruptly to zero","About half of the center value","Almost the same as at the center","About twice the center value","Inside an ideal long solenoid, B=μ₀NI/ℓ, which in normalized units of μ₀I/(2R) is 2N/ℓ=",". The exact superposition for the finite length gives a central value of ",", which is lower than the ideal value by ","%, because no current elements beyond the ends contribute and the field weakens near the ends; the larger ℓ is compared to R, the closer the field near the center is to the ideal value. For the probe at z=",", Bz=","Keep N=12 and ℓ=6R, and move the probe to z=2.2R (still inside the tube, near the end). What is the normalized Bz? ","For a ring, Bz=(1+z²)^(−3/2) is an even function of z, with maximum value 1 at z=0, decreasing monotonically on both sides. At the current z=",", the reading is only "," (about ","% of the maximum). A single reading cannot tell which side of the ring you are on; move the probe along the axis and find the position of maximum reading, or find two positions ±z with equal readings, and the ring's center is at their midpoint. ","A point on the axis reads 0.5 (in units of μ₀I/(2R), half the maximum). What is its distance |z|/R from the center of the ring? ","Every point on the circular loop is at distance R from the wire, so B=μ₀I/(2πR) has the same magnitude everywhere and is everywhere tangent to the loop; therefore ∮B·dℓ=B·2πR=μ₀I, and B can be found without doing an integral. For each angle φ swept, the path covered so far has ∫B·dℓ/μ₀=Iφ/(2π), increasing uniformly, and one full turn gives the complete I=",". This symmetry is why the circular loop is convenient; it is not that Ampère's law holds only for circles. ","Change the current to I=2 (relative units). After going 1/3 of the way (120°) counterclockwise around the circular loop, what is ∫B·dℓ/μ₀ over the path so far, in units of I₀? ","Not the same. Points on the ellipse are at different distances from the wire, and B=μ₀I/(2πr)∝1/r: the ends of the minor axis are nearest and the ends of the major axis farthest, with relative magnitudes in the ratio 1:"," (a=","), and the direction of B along the loop is not always tangent to it. But when the B·dℓ contributions of all segments are added, the complete loop still satisfies ∮B·dℓ=μ₀I="," (I₀), because B·dℓ=(μ₀I/2π)dφ depends only on the polar angle swept, not on the shape of the path. ","Take a=2.0 and I=1. After going 1/12 of the full loop counterclockwise (parameter angle 30°, starting from the end of the major axis), what is ∫B·dℓ/μ₀ over the path so far, in units of I₀? ","The current is changed to ",", so B circulates clockwise while the sampling direction is still counterclockwise; the tangential component of B is opposite to dℓ, B·dℓ is negative everywhere, so ∮B·dℓ/μ₀=−1: the sign of the full loop flips and its magnitude is still μ₀|I|. The loop shape (a=",") changes only the local distribution, not the full result. Here the sign reflects whether the “loop direction” and the “current direction” obey the right-hand rule. ","The current is still −1, but the integration direction is changed to clockwise once around the loop. What does ∮B·dℓ/μ₀ equal? ","Inside a thick wire, a circle of radius r encloses only the current Ienc=I·r²/R²="," A. From B·2πr=μ₀Ienc, B=μ₀Ir/(2πR²)="," μT. Because Ienc∝r² and the circumference ∝r, B inside the wire is proportional to r (rises linearly), reaches its maximum at the surface r=R, and falls off as 1/r for r>R. ","Wire radius R=0.02 m, current changed to 14 A, probe at r=0.012 m (inside the wire). What is B, in μT? ","In a coaxial cable the central conductor carries +I and the outer shell (2R–3R) carries a uniform return current −I. When r="," m>3R, the Ampèrian loop encloses both, Ienc=I−I=0, so B=0: there is no field outside, which is the shielding action of a coaxial cable. Inside the shell, such as at r=2.5R, only part of the return current is enclosed, so B is not zero. Currently Ienc="," A. ","R=0.02 m, I=10 A, move the probe to r=0.05 m (inside the return shell). What is B, in μT? ","Take a rectangular loop: one side inside the tube (length ℓ, field B), one side outside (B≈0), and the two perpendicular sides perpendicular to B, so ∮B·dℓ=Bℓ. The enclosed current is Ienc=nℓI, and Bℓ=μ₀nℓI gives B=μ₀nI=4π×10⁻⁷×"," mT, with ℓ canceling. B inside the tube does not depend on the distance r from the axis (a uniform field for r<R). ","A long solenoid is changed to a turn density n=800 m⁻¹ and current I=7 A. What is B inside the tube, in mT? ","In the toroidal region, a circle of radius r encloses the current of all N turns, Ienc=NI="," A, so B=μ₀NI/(2πr)="," mT, along the circumferential direction and varying as 1/r. A circular loop in the central hole (r<R) encloses no current (all the current is in the ring), Ienc=0, so B=0. A circle outside the toroid (r>2R) is threaded by every turn once in and once out, so the net current is also zero. ","For the same toroidal solenoid, with the probe at r=0.05 m (outside the ring), what is B? ","Of the same order as inside the ring, extrapolated as 1/r","Zero, because the net enclosed current is zero","Equal to μ₀nI (the formula for the inside of a solenoid)","About half the maximum inside the ring","A ring in the field region (r<R) has flux Φ=B·πr² through it, so ε=−dΦ/dt=−πr²(dB/dt)="," mV. The induced electric field is uniform around the circle, ε=Eθ·2πr, so Eθ=ε/(2πr)=−(r/2)dB/dt="," V/m. B out of the screen is increasing; by Lenz's law the induced current produces a field into the screen, which requires a clockwise current, consistent with ε<0 (counterclockwise positive). ","Keep R=0.05 m, change dB/dt to 2.5 T/s and the ring radius to r=0.04 m (still inside the field). What is the magnitude of the induced emf, in mV? ","The loop radius r="," m is larger than the field-region radius R="," m. B≈0 at the loop itself, but the loop encloses the region where the field is changing, so the rate of change of flux is still −πR²dB/dt, giving ε="," mV and Eθ=ε/(2πr)="," V/m (falling off as 1/r). The induced electric field is produced by the changing magnetic field, not determined by B at the point where it is measured, and no wire is needed; its loop integral is not zero, so it cannot be described by a potential. ","R=0.05 m, dB/dt=1 T/s. If the ring radius is increased to r=0.14 m, what is |Eθ|, in mV/m? ","The field points out of the screen but is weakening (dB/dt="," T/s). The outward flux through the loop decreases, so by Lenz's law the induced current produces an outward field to oppose the decrease; the current is therefore counterclockwise, ε=+"," mV, Eθ=+"," V/m, exactly opposite in direction to the case of an increasing field and with the same magnitude (it depends only on |dB/dt|). ","The magnetic field points into the screen and is decreasing in magnitude. What is the direction of the induced current in the loop? ","Cannot tell; depends on the loop radius","Flux linkage NΦ=NBA cosωt. At θ=0 the coil plane is perpendicular to B and NΦ reaches its maximum NBA="," Wb, but the flux is at its maximum here, so the rate of change dΦ/dt=0 and ε=NBAω sinωt=0. The peak emf NBAω="," V occurs where the flux is zero and the curve is steepest (θ=90°), a phase difference of 1/4 period. ","Keep N="," T, A="," m², ω="," rad/s. The coil turns another 45° (1/8 period) from the position of maximum flux. What is ε in V? ","Flux linkage amplitude NBA="," Wb is unchanged, but it varies faster: ε=NBAω sinωt, and the peak is proportional to ω. At ω="," rad/s, ε_max="," V (twice the value at ω=2). The period T=2π/ω="," s is halved. The curves are narrower and taller, and the phase difference between flux and emf is still 1/4 period. ","After the rotation rate doubles, how does the peak (amplitude) of the flux linkage NΦ change? ","Doubles","Halves","Becomes four times as large","The single-turn flux Φ=BA cosωt depends only on B, A and coil orientation, not on the number of turns; its amplitude is still BA="," Wb. The amplitude of the total flux linkage NΦ is proportional to N: at N=",", NBA="," Wb (twice the value at N=8); ε=−dNΦ/dt, and the peak NBAω="," V also doubles, since the emfs of the turns in series add. ","Change to N=12, B=0.5 T, A=0.3 m², ω=3.5 rad/s. What is the peak emf in V? ","Read two quantities from the graph: the period T and the peak emf ε_max. ω=2π/T. In this case T="," s, so ω="," rad/s. Since ε_max=NBAω, NBA=ε_max/ω="," Wb. The amplitude of the flux-linkage curve in the same graph is NBA, so the two cross-check each other. ","A graph shows period T=1.2 s and peak emf 3.2 V. What is NBA in Wb? ","The positive charge q attracts free electrons in the conductor to the side nearer q, so negative induced charge appears on the near surface and positive charge on the far side (an isolated neutral sphere still has total charge 0). This distribution makes E=0 inside the conductor. A grounded sphere can exchange charge with the earth, its potential is 0, and its total charge is −qR/d="," q₀; the surface is negative everywhere, and σ is larger closer to the charge. ","External charge q=2 q₀ at distance d=2.5R from the center. What is the net charge on the grounded sphere, in q₀? ","q is negative, so positive induced charge (σ>0) is drawn to the near side of the surface and the far side of an isolated sphere gets negative charge, with total charge still 0; all signs are reversed compared with positive q. When grounded, σ everywhere on the sphere has the same sign as −q, and the total charge is −q/d=+"," q₀. d=","R is relatively close, so the induced charge is concentrated on the near side and is also larger. ","The grounded sphere is still acted on by the negative charge q=−1. What are the signs of the induced surface charge? ","All positive","Positive near side, negative far side","Positive near side, zero far side","All negative","Moving the charge farther away lowers the potential kq/d at the conducting sphere, so less charge needs to be drawn from the earth: net charge of the grounded sphere −qR/d="," q₀ (−0.571 q₀ at d=1.75); |Q| decreases inversely with d. An isolated neutral sphere still has 0, but the charge is distributed more uniformly (weaker polarization). The farther q is from the sphere, the less induced charge on the surface and the smaller its effect on the field outside. ","External charge q=−2 q₀ at the closest position d=1.15R. What is the net charge on the grounded sphere, in q₀? ","Inside the metal E=0. Take a Gaussian surface in the shell (within the metal) enclosing the cavity: ∮E·dA=0, so the enclosed total charge is zero, and the inner wall must carry −q="," q₀. The shell as a whole is neutral (Q=0), so the outer wall carries +q="," q₀. Thus outside the shell E=","/r², and inside the cavity E=q/r² (independent of the shell); inside the metal E=0 and V is constant at "," kq₀/a. ","Neutral isolated shell (Q=0), cavity charge changed to q=2 q₀. What is Eᵣ at r=2.4a outside the shell, in kq₀/a²? ","After adding charge Q="," q₀ to the shell, the inner wall must still be −q (the Gaussian-surface condition is unchanged and depends only on the charge in the cavity); all the extra charge goes on the outer wall, which becomes Q+q="," q₀. The field inside the cavity is determined by q alone, so it is unchanged; the field outside the shell increases to ","/r². E inside the metal is still zero, but V rises because of the added outer-wall charge, to ","Keep q=1 q₀ and change the net charge of the shell to Q=−2 q₀. What is the potential inside the metal shell, in kq₀/a? ","Grounding puts the shell at the same potential as the earth: V_metal=0. The integral of E outside the shell out to infinity must be 0, and V is constant in the metal, so there is no field outside the shell and the outer wall carries no charge. Before grounding the outer wall had Q+q=+1 q₀ (E=1/r² outside); after grounding, +q flows through the wire into the earth, E=0 outside the shell, and the field in the cavity and the inner-wall charge −q are unchanged. This is grounded shielding: the outside no longer senses the charge in the cavity. ","Grounded shell unchanged; change the cavity charge to q=2 q₀. What are the outer-wall charge and the electric field outside the shell? ","Outer wall +2 q₀, field 2/r² outside the shell","Outer wall zero, no field outside (inner wall −2 q₀)","Outer wall −2 q₀, field outside reversed","Outer wall +1 q₀, field outside halved","Isolated shell: inner wall −q (by Gauss's law); outer wall Q+q="," q₀. Since Q=−1 and q=1 cancel, the outer wall has no charge, so E=0 outside the shell, but that does not mean the cavity has no charge. Inside the cavity E=q/r² still holds (4 at r=0.5a). A reading outside the shell only tells you the total charge Q+q; it cannot distinguish “Q=−1, q=+1” from “Q=q=0”. To detect the charge in the cavity you must put a probe inside the cavity or know Q separately. ","Keep Q=−1 q₀ and change the cavity charge to q=2 q₀ (isolated shell). What is Eᵣ at r=2.4a outside the shell, in kq₀/a²? ","With the charge at the center, every point on the sphere is a distance R from it. By spherical symmetry E is radial and has the same magnitude everywhere, parallel to the outward normal n, so E·n is the same constant over the whole sphere (here ",", in units of q₀/(4πε₀R²)), so it can be taken out of the integral: Φ=∮E·n dA=E·4πR², i.e. Qin/ε₀. Once the charge leaves the center, E·n varies with position on the surface and cannot be pulled out this way; only Gauss's law applied to the whole surface can be used. ","Keep the moving charge at the center (q unchanged) and also fix a +2q₀ charge at the center. What is E·n at any surface element of the sphere (in units of q₀/(4πε₀R²))? ","The charge is still inside the sphere (distance from center ","R), so Qin is unchanged and the net flux is always "," q₀/ε₀. Only the distribution of flux over the surface changes: the element nearest the charge (in the charge's direction, θ=90°, φ≈","°) has E·n≈",", the farthest only ",", differing by about "," times. The local flux changes most on the patch of sphere nearest the charge. Moving the charge only shifts outgoing flux from some surface elements to others; the integral is unchanged. ","Move the charge farther along the same direction toward the surface, but still inside the sphere (e.g. to 0.9R from the center). Which statement is correct? ","E·n at the nearest element increases, and the net flux increases too","E·n at the nearest element increases greatly, net flux unchanged","E·n at the nearest element unchanged, net flux unchanged","E·n at the nearest element decreases, net flux unchanged","The charge is outside the sphere (distance from center ","R), so Qin=0 and the net flux is 0. On the side nearest the charge, E points into the sphere, E·n<0 (orange, inflow), with the nearest point at about ","; on the far side, E leaves the sphere, E·n>0 (green, outflow), with the farthest point at about ",". Every field line entering the sphere must leave on the other side, so the inflow Φ₋ and the outflow Φ₊ have equal magnitude and opposite sign and cancel. ","Move the moving charge along the x axis to x=2.0 (y=0), with no charge at the center. What is the magnitude of the flux into the sphere |Φ₋| (in units of q₀/ε₀)? ","Net charge inside the sphere Qin=q+q₀=",", so Φ=0. But E on the surface is not zero: at the nearest point on the charge's side E·n≈",", and at the farthest point on the other side E·n≈",", and the fluxes of the positive and negative elements exactly cancel. The net flux only reflects the algebraic sum “outflow minus inflow” and cannot imply E=0 at every point, so the answer is no. ","Move the moving charge along the x axis to x=0.8 (y=0), with the center charge q₀ unchanged. What is E·n at the surface element at θ=90°, φ=0° (in units of q₀/(4πε₀R²))? ","Local field: the closer the charge is to the surface, the larger E·n at the nearest element; at a distance of ","R it is about ",", and it tends to infinity as the charge approaches the surface (the display warns that the numerical integration is unreliable); once the charge crosses the surface, E at the near elements points into the sphere and E·n changes from a very large positive value to a very large negative value. Enclosed charge: with the charge inside the sphere, Qin=q=",", Φ="," q₀/ε₀; once it moves outside, Qin=0 and Φ jumps to 0. The field changes continuously while Qin jumps, so the flux jumps too. ","The charge moves from x=0.9R to x=1.1R (just crossing the surface, no charge at the center). Which description is correct? ","Net flux decreases gradually from 1 and is still about 0.5 at x=1.1R","Net flux jumps from 1 to 0; E·n at the nearest element changes from a large positive to a large negative value","Net flux stays 1, because the field at the nearest element is stronger","Net flux changes from 1 to −1, because the charge is outside the sphere","R: the Gaussian surface is inside the shell and encloses charge Qenc=0. By spherical symmetry E·4πr²=Qenc/ε₀=0, so E=0 inside the shell (arrow length zero). Crossing the shell at r=R, the enclosed charge goes from 0 to Q and E jumps from 0 to E₀ (the field is discontinuous at a surface charge, giving a step in the curve); outside the shell it falls off as 1/r², the same as a point charge. ","Set the charge-density multiplier to 1.5 and the Gaussian-surface radius to r=2.5R. What is the relative field E/E₀ of the spherical shell? ","Inside a uniformly charged solid sphere, Qenc=Q(r/R)³ and the Gaussian sphere has area 4πr², so E=Qenc/(4πε₀r²)∝r³/r²=r. At r=","R, E=","E₀; it reaches its maximum E₀ at r=R and then falls as 1/r². Unlike the shell, the field of the solid sphere is continuous at r=R, with no step. ","The Gaussian-surface radius inside the solid sphere increases from 0.3R to 0.6R. By what factor does E change? ","8 times","Take a coaxial cylindrical Gaussian surface. The end faces have no flux; only the side contributes: E·2πrℓ=λencℓ/ε₀. Outside the cylinder λenc is constant, so E∝1/r; on a spherical Gaussian surface E·4πr²=Q/ε₀, so E∝1/r². The field outside a cylinder falls off more slowly: at r=2R the cylinder gives ","E₀, while the sphere gives only ","E₀. Inside the cylinder Qenc∝r² and the area ∝r, so E∝r; at r=","R, E=","E₀. ","Set the density multiplier to 1.4 and the Gaussian-surface radius to r=2.5R. What is E/E₀ for the infinitely long charged cylinder? ","The shell and the solid sphere are identical for r≥R, both E=Q/(4πε₀r²); for example at r=","E₀, so readings taken outside cannot tell them apart. The difference is inside: E=0 inside the shell, but E∝r in the solid sphere, e.g. at r=0.4R and 0.8R it is ","E₀ and ","E₀. So take two points inside: readings of all 0 mean a shell; readings proportional to r mean a solid sphere. Then take two outside readings: if the field becomes 1/4 when r doubles, the distribution is spherically symmetric; if it becomes 1/2, it is a cylinder. ","Measurements of some distribution: inside, the readings at r=0.4R and 0.8R are 0.4E₀ and 0.8E₀; outside, the readings at r=1.5R and 3R are 0.667E₀ and 0.333E₀. Which distribution is it most likely to be? ","Uniformly charged solid sphere","Infinitely long uniformly charged cylinder","Nonuniform sphere with ρ∝r²","For ρ=ρ₀(r/R)ⁿ, Qenc=∫₀ʳρ·4πr′²dr′=Q(r/R)ⁿ⁺³ (since ρ₀=(n+3)Q/(4πR³)). So E=Qenc/(4πε₀r²)∝rⁿ⁺¹; n="," gives E∝r",". At r=","R, Qenc/Q=",", E=","E₀, far less than the uniform sphere's ","E₀. The more the density is concentrated toward the outside (larger n), the weaker the field inside, rising to E₀ only at r=R. ","Change the density exponent to n=1.5 and the Gaussian-surface radius to r=0.7R. What is E/E₀ for the nonuniform sphere? ","Take a pillbox through the plane (cylindrical, with end faces parallel to the sheet). The side is parallel to E so its flux is zero; each end face gives EA, total 2EA=σA/ε₀, so E=σ/(2ε₀). The area A cancels from both sides, and the height (distance of the end faces from the sheet) never enters the formula, so making the pillbox taller leaves E unchanged (E/E₀ is constantly ","). The field lines of an infinite plane are parallel and do not spread out, so the field does not fall off with distance. ","Infinite uniformly charged plane: when the probe moves from x=0.6a to x=1.8a, by what factor does E change? ","3 times","Inside the slab, take a pillbox with its end faces a distance x from the midplane. The enclosed charge is ρ·A·2x, so 2EA=ρ·2xA/ε₀ and E=ρx/ε₀, increasing linearly with x (0 at the midplane, by symmetry). At the slab surface x=a, E reaches its maximum E₀=ρa/ε₀. A pillbox outside encloses the charge of the whole thickness, which no longer increases, so E stays constant at E₀ (the same as an infinite plane). So from the midplane outward the field first rises linearly and then becomes constant, continuous at x=a. At x=","a, E=","Set the density multiplier to 1.4 and the probe to x=0.5a. What is E/E₀ for the uniform thick slab? ","Divide the rod into small symmetric segments; the field of each segment points along the line from that segment to the observation point. Two segments on opposite sides of the perpendicular bisector, symmetric about the midpoint, have horizontal components of equal magnitude and opposite direction that cancel in pairs, so Eₓ=0; the vertical components point the same way and simply add. With "," segments the discrete sum is ",", the analytic value is ","%: with too few segments, each is treated as a point charge at its midpoint, a rather rough approximation. ","Change the total charge to q=−2 and the observation distance to y=0.5, with the number of segments still 3. What is the discrete sum Eᵧ (signed, upward positive)? "," gives discrete sum ",", analytic value ",", a difference of only "," (about ","%). With finer segmentation, each segment is closer to a point charge and r varies less within it, so the discrete sum approaches the integral Eᵧ=Q/[y√(1+y²)]. The error of the midpoint rule is proportional to the square of the segment length. ","Increase the number of segments from 34 to 68 (all else unchanged). The difference between the discrete sum and the analytic value becomes about how many times its original size? ","About 1/2","About 1/4","About 2 times","Distance from the observation point to the rod y="," is already less than half the rod length, while each segment has length 2/n=",", which is larger than y. Now the distance from each segment to the observation point varies greatly with position (the segment near the center has r≈y, while a segment at the end has a much larger r), and the error of “treating the whole segment as a point charge at its midpoint” grows: the 5-segment discrete sum is ",", a deviation of about ","%, more noticeable than at y=1.25. So the closer you are, the more segments you need. ","Why are more segments needed to reach the same accuracy when the observation point is close to the rod? ","The field is weaker nearby, so the discretization error is relatively larger","The integrand varies more sharply with position nearby, and the segment length is no longer small compared with y","The horizontal components no longer cancel nearby","Coulomb's law no longer holds nearby","Object distance "," cm is greater than the focal length "," cm, 1/di=1/f−1/do, so di="," cm>0: the refracted rays truly converge, forming a real image; place the screen at "," cm for the sharpest image (the two rays on the screen are then 0 apart). Magnification m=−di/do=",", the negative sign means inverted, |m|<1 means reduced, and the image height is about "," cm. ","Keep the focal length and object height unchanged and move the object to d=20 cm. What is the height of the sharp image (positive value)? "," cm is less than the focal length "," cm, 1/di=1/",", so di="," cm. The negative sign means the emerging rays no longer converge but diverge (the green lines are what actually propagates); only their backward extensions (orange dashed lines) intersect on the same side as the object, "," cm away, forming an upright virtual image magnified "," times. A screen can only receive light that actually converges, so no matter how the screen is moved, the two rays on it never meet. ","A converging lens with f=12 cm, object still inside the focal point; change the object distance to d=10 cm. What is the magnification m? ","Diverging lens f=−"," cm, 1/di=−1/"," cm: a virtual image on the object side of the lens, at a distance of "," cm from the lens (closer than the focal length). m=−di/do=+",", upright and reduced. As the object distance changes, |di|=f·do/(do+f) is always less than f and m=f/(do+f) is always less than 1, so a diverging lens always gives an upright, reduced virtual image located between the lens and F′. ","A diverging lens (f=12 cm): as the object distance decreases from 25 cm to 6 cm, how does the virtual image change? ","Gets larger, but always smaller than the object, still an upright virtual image","Gets larger, and becomes an enlarged real image when d<f","Gets smaller and moves to the other side of the lens","Size unchanged, only its position changes","Concave mirror f=+"," cm, object distance "," cm, di="," cm>0. For a mirror, di>0 means the reflected rays really converge in front of the mirror, so the real image forms in front of the mirror, on the same side as the object; no light reaches behind the mirror. So the screen (or detector) should be placed in front of the mirror at "," cm, m=",", inverted and reduced. This is numerically the same as the result for a converging lens, except that the image and object are on the same side. ","Concave mirror f=12 cm; move the object to d=16 cm. What is the image distance di? ","Convex mirror f=−"," cm<0: the reflected rays diverge, and their backward extensions intersect behind the mirror at "," cm, forming an upright, reduced virtual image behind the mirror (m=+","). In common with the diverging lens: f<0, the same formula, and the image is always virtual, upright and reduced, inside the focal point, with identical numerical values; the difference is that the virtual image of a convex mirror is behind the mirror, while that of a diverging lens is on the same side as the object. ","Where is the image formed when an object is in front of a convex mirror? ","In front of the mirror, inverted real image","In front of the mirror, upright virtual image","Behind the mirror, upright reduced virtual image","Behind the mirror, inverted real image","A sharp image forms at the screen, so di="," cm, do="," cm. From 1/f=1/do+1/di=1/",", so f="," cm. Check: with do=20 cm, di=f·do/(do−f)="," cm, magnification m=−di/do=","; if the newly measured image distance agrees, the focal length found from the first set of data is reliable. ","In an experiment, a sharp image forms on the screen at an object distance of 24 cm, with the screen 16 cm from the lens. What is the focal length of the lens? ","When the refraction angle is 90°, n₁sinθc=n₂sin90°, so θc=arcsin(n₂/n₁)=arcsin(","°. The angle of incidence is now ","° is less than θc, and the refraction angle is ","°; light passes from the optically denser to the less dense medium and bends away from the normal. As the angle of incidence increases further, the refraction angle increases, and when it reaches ","° the refracted ray grazes along the interface; beyond that there is no refracted ray and all the light is reflected. ","Keep n₁=1.5 and change n₂ to 1.2. What is the critical angle? ","Total internal reflection requires sinθ₂=(n₁/n₂)sinθ₁>1. Here n₁=",", sinθ₂=sinθ₁/","<1, so there is a solution for any angle of incidence and total internal reflection is impossible. Even at the maximum angle of incidence of 85°, the refraction angle is only ","°, with a limit of arcsin(n₁/n₂)=","°. Total internal reflection can only occur when light goes from a medium of higher index of refraction to one of lower index of refraction. ","Which of the following situations could produce total internal reflection? (glass n=1.5, water n=1.33, air n=1.00)","Air into glass, incidence angle 85°","Glass into water, incidence angle 50°","Water into glass, incidence angle 80°","Glass into water, incidence angle 70°","From n₁sinθ₁=n₂sinθ₂, n₂=n₁sinθ₁/sinθ₂. Current data: θ₁=","°, θ₂=","°, n₂=sin",". In the experiment, measure several sets, plot sinθ₁ (vertical) against sinθ₂ (horizontal); the slope is n₂/n₁ (here n₁=1), which is more reliable than a single reading. ","Light in air enters a transparent material at θ₁=60° and the measured refraction angle is θ₂=35°. What is the index of refraction of the material? ","The apparent depth is less than the actual depth. When light passes from water into air the refraction angle is larger than the incidence angle, so two neighboring rays leaving the water surface spread out more than in the water; the eye traces them back in straight lines and the extensions meet at a shallower point below the surface. For paraxial rays d_app=d/n="," cm (the figure's traced-back value is "," cm), less than the actual depth "," cm, so the object looks shallower. ","Viewing nearly head-on (incidence angle 0°), change the index of refraction of the water to 1.45 and the actual depth to 33 cm. About what traced-back apparent depth does the figure give? ","As the incidence angle increases, the exit angle departs further from the normal (sinβ=n·sinα, with α=","° giving β≈","°), and the intersection of the backward extensions of two neighboring rays moves up and sideways: the traced-back depth decreases from the head-on value of "," cm to "," cm (at 12° it is "," cm), and the intersection is also displaced horizontally from directly above the object by about "," cm. In oblique viewing the apparent depth is no longer d/n, and the image point is not directly above the object. ","The viewing angle increases from 12° to 28°. How does the intersection of the two extension lines change? ","Deeper, and still directly above the object","Shallower, and displaced farther horizontally from directly above the object","Depth unchanged, still d/n, only moves left or right","Shallower, but always directly above the object","It gets closer to the water surface. The larger n is, the more the rays deviate from the normal on leaving the water and the shallower the intersection of the backward extensions; for paraxial rays d_app=d/n: at n=1.33 it is "," cm, at n="," it is "," cm. In the figure, at ","°, the traced-back depth changes from "," cm to "," cm; the actual depth stays at "," cm. ","Paraxial observation: the actual depth of the pool is 24 cm, and the bottom appears only 15.0 cm deep. What is the index of refraction of the water? ","The right side is heavier (μ₂=μ₁×","), Z₂=√(Tμ₂)>Z₁. Reflection coefficient r=(Z₁−Z₂)/(Z₁+Z₂)=","<0, so the reflected pulse is inverted, with an amplitude equal to ","% of the incident pulse; transmission coefficient t=2Z₁/(Z₁+Z₂)=",">0, so the transmitted pulse is not inverted. Wave speed v=√(T/μ); the tension is the same and μ is larger on the right, so v₂/v₁=1/√ratio=",", the transmitted wave is slower and the pulse is compressed in space. ","Change the linear density on the right to 4 times that on the left. What is the reflection amplitude coefficient r (signed)? ","The right side is lighter (μ₂=μ₁×","), Z₂<Z₁, reflection coefficient r=",">0, so the reflected pulse is not inverted, opposite to the previous scenario. Transmission coefficient t=",">1: the displacement amplitude of the transmitted wave is even larger than that of the incident wave, but the energy does not increase, because Z of the light string is smaller and the same power needs a larger amplitude; transmitted wave speed v₂/v₁=",", d fixed, and change the string length to 1.5 m. What is the spacing between adjacent nodes? ","Both ends of the string are fixed, so the displacement must be zero there: both ends are nodes. sin(kL)=0, kL=nπ, λ=2L/n. n=1 is the lowest frequency; the string holds only half a wavelength, so λ₁=2L="," m, and the fundamental frequency is f₁=v/(2L)="," Hz. A wavelength longer than 2L could not have nodes at both ends; the shorter allowed values (2L/2, 2L/3, …) are all higher harmonics. ","With everything else unchanged, the string length is doubled. How do the fundamental frequency and the fundamental wavelength change? ","Frequency halves, wavelength doubles","Frequency doubles, wavelength halves","Frequency halves, wavelength unchanged","Frequency unchanged, wavelength doubles","For n=3 the string has 3 antinodes (the number of antinodes equals n) and 4 nodes (including the ends). The frequency is f₃=3v/(2L)="," Hz, which is 3 times the fundamental f₁="," Hz. The harmonic frequencies of a fixed-end string are in the ratio 1:2:3:…, and every pair of adjacent nodes is half a wavelength apart, λ/2=L/3. ","The same string (wave speed unchanged) is tuned to n=5. Which statement is correct? ","5 antinodes, frequency 5 times the fundamental","5 antinodes, frequency 9 times the fundamental","6 antinodes, frequency 5 times the fundamental","6 antinodes, frequency 6 times the fundamental","f=nv/(2L), so for fixed n and v, f∝1/L. The string length changes from 1 m to "," m ("," times the original), so the frequency becomes 1/"," of the original. For n="," it goes from "," Hz to "," Hz, and the wavelength 2L/n increases to "," m. The longer the string, the more room there is for half a wavelength, so the frequency of the same mode is lower. ","The string length is 1.5 m and n=2. To restore the standing-wave frequency to 4 Hz, what should the wave speed be adjusted to? ","Both ends are open, so both ends are displacement antinodes. For the fundamental, the tube holds exactly half a wavelength: λ₁=2L="," m, f₁=v/(2L)="," Hz. The open ends are connected to the atmosphere, so the pressure stays nearly atmospheric there: they are pressure nodes. A pressure node is at a displacement antinode, and a pressure antinode is at a displacement node. So for n=1 the two pressure nodes are at the two ends of the tube (x=0 and x=L), and the middle of the tube is a displacement node and a pressure antinode. ","Both ends are open. Change the tube length to 0.6 m and take the wave speed as 340 m/s. What is the fundamental frequency? ","The closed end is a displacement node (air cannot pass through the wall) and the open end is a displacement antinode. A displacement node and the adjacent antinode are λ/4 apart, and the tube holds exactly the shortest “node-to-antinode” segment, so L=λ/4 and λ₁=4L="," m, f₁=v/(4L)="," Hz. A longer wavelength cannot satisfy “node at the closed end, antinode at the open end” at the same time, so the fundamental wavelength is 4L, not the 2L of an open tube. ","With the same tube length and wave speed, how does the fundamental frequency of a closed tube compare with that of an open tube? ","The closed tube's fundamental is 1/2 that of the open tube","The closed tube's fundamental is 2 times that of the open tube","They are the same","The closed tube's fundamental is 1/4 that of the open tube","A closed tube allows only L=(2k−1)λ/4, that is, n=1, 3, 5, …. For n=3, L=3λ/4 and λ="," m, and the tube holds exactly three quarter-wavelengths (starting from the node at the closed end: node–antinode–node–antinode). The frequency is f₃=3v/(4L)="," Hz, which is 3 times the fundamental "," Hz. Even harmonics would make the open end a displacement node, which is not allowed. ","A closed tube has its length changed to 0.6 m (wave speed 343 m/s), and n=5. What is the frequency? ","For a string fixed at both ends, fₙ=nv/(2L), the same form as an open tube: for the same L and v, with n="," f="," Hz, λ="," m, and the frequencies are exactly the same. The difference is in the boundaries: the string's ends are displacement nodes, with displacement varying as sin(kx); the open tube's ends are displacement antinodes, with displacement varying as cos(kx). The displacement patterns of the two systems are complementary: the positions of nodes and antinodes are exactly swapped. Conversely, the open tube's pressure has nodes at both ends and varies as sin(kx), which has the same shape as the string's displacement, with nodes at the same positions. ","For the same L, v, and n, the displacement nodes of a string fixed at both ends are at the same positions as the nodes of which quantity? ","Displacement in an open tube","Pressure in an open tube","Pressure in a closed tube","Displacement in a closed tube","Unpolarized light passing through the first polarizer is halved in intensity, to I₀/2. The polarized light then passes the second polarizer and, by Malus's law, is multiplied by cos²θ (θ is the angle between the two polarization directions): 0.5 at θ=0°, ",", and 0 at θ=90°. The current θ=","°, and the output is "," I₀. The output intensity I=½I₀cos²θ falls smoothly between 0° and 90°. ","Rotate the second polarizer to 30°. What is the output intensity I/I₀? ","After the first polarizer the light is linearly polarized along its transmission axis. When the second polarizer is perpendicular to it (θ=90°), cos²90°=0, no component can pass through the second polarizer, the output is 0, and the screen is completely dark. Crossed polarizers mean that the component of the light's electric field along the second polarizer's transmission axis is zero. ","With the two polarizers crossed, if the first one is removed and only the second remains, what is the output intensity I/I₀ for unpolarized incident light? ","A polarizer does not simply “block” light; it turns the light that passes into linearly polarized light along its own transmission axis. After the first polarizer the polarization direction is 0°. After passing a second po
