arge","If the potential is negative, must the field be negative? ","Far from the source charge","How does the magnitude of the tangent slope change? ","Eₓ = −dV/dx. The sign of the potential and the direction of the field are set by the potential value and the slope, respectively. ","Continuous charge superposition · charged thin rod","A uniformly charged thin rod lies horizontally and the observation point is on its perpendicular bisector. Arrows show each segment's contribution; with finer segments the sum approaches the continuous integral. ","Number of segments","Observation distance / half rod length","Total charge (normalized)","Coarse segments","Which field components cancel? ","Fine segments","How far is it from the analytic value? ","Near field","Why is finer segmentation more necessary up close? ","The horizontal components of symmetric segments cancel, and the vertical components add. With finer segments the discrete sum approaches the continuous integral. ","Observation point","Discrete Eᵧ ","Continuous Eᵧ ","Apparent depth of an underwater object","Take two nearby rays. The index of refraction of air is about 1; the orange dashed lines show the observer's backward extension along the exit direction. ","Water index of refraction","Actual depth (cm)","Central incidence angle in water (°)","Near-normal viewing","Is the apparent depth greater or less than the actual depth? ","Oblique viewing","How does the intersection of the two backward extensions move? ","Raise the index of refraction","Will the object look closer to the water surface? ","Rays leaving into air bend away from the normal. The eye traces them back in straight lines, and the extensions of two nearby rays meet at a shallower point below the surface. ","Object","Actual depth ","Back-traced intersection depth of two adjacent rays ","Paraxial formula d/n ","Oblique viewing: the intersection moves with viewing angle, so there is no single image point","Near-normal viewing: intersection ≈ paraxial apparent depth","Doppler effect · moving source vs. moving receiver","One-dimensional approximation along the line joining source and receiver. Use the wavefronts and received frequency to compare where the same approach speed comes from. ","Speed / speed of sound","Emitted frequency (Hz)","Source moves right","Why are the wavefronts denser in front of the source? ","Receiver moves left","The wavelength is unchanged, so why does the received frequency still increase? ","Reverse the motion","When the observer moves away, is the received frequency higher or lower? ","Source motion changes the wavefront spacing in the medium. Receiver motion changes the rate at which it meets wavefronts. For the same speed, the received frequencies in the two cases are generally different. ","Source","Receiver","Emitted ","Received ","Front wavelength / rest wavelength ","Hydrogen atom transitions and spectral lines","Choose a pair of levels with principal quantum number 1–6 and compare absorbing and emitting a photon of the same energy. ","Lower level n","Higher level n","Visible spectrum · Balmer","Which spectral line matches the energy difference from n=4 to n=2? ","Ultraviolet · Lyman","Why is the wavelength usually shorter when the final state is lower? ","Reverse absorption","Does the reverse transition need a different wavelength? ","Infrared · Paschen","How do the energy differences between nearby high levels compare? ","The photon energy equals the magnitude of the energy difference between the two levels. Absorption and emission between the same pair of levels have the same wavelength. ","Energy level (eV, vertical scale by energy)","Wavelength (nm, log axis)","Visible","Absorbed photon","Emitted photon","Wire","DC source","AC source","Current source","Resistor","Bulb (constant resistance)","Switch","Capacitor","Inductor","Series voltage division","Is the current the same in each resistor? After changing R₂, which part gets more voltage? ","Current is the same in series. The voltage division ratio equals the resistance ratio. ","Parallel branch opened","Open the switch. Does the current in the other branch change? ","An ideal source fixes the voltage across it, so the current in the other branch is unchanged and the total current decreases. ","Two sources, two loops","First choose a positive direction for each branch, then determine the actual current direction. ","A negative current means the actual direction is opposite to the positive direction defined for the component. The potential changes around each loop sum to zero. ","Balanced bridge","Measure the middle branch first, then adjust only one resistor. Under what condition is the bridge-branch current zero? ","The current is zero when the two ends of the bridge are at equal potential. Then the voltage division ratios on the two sides are equal. ","Power with the same source","The two branches have the same voltage. Which resistor dissipates more power? ","At the same voltage P=V²/R, so the smaller the resistance, the greater the power. ","RC charging","Record the initial and final capacitor voltage first, then find the time when it reaches about 63%. ","When uncharged V_C is zero, and in steady state it approaches the source voltage. The time constant is RC. ","RC discharging","The capacitor is already charged before the run. After connecting, what is the current direction? ","The capacitor supplies energy to the resistor. The discharge current gradually reduces the capacitor's charge. ","Same RC · group A","With RC fixed, compare the initial current and final capacitor voltage of the two groups. ","Both groups have a time constant of 1 s. The initial current is the source voltage divided by the resistance. ","Same RC · group B","Turn on the A/B curves and compare the currents for the same time constant. ","Group B's resistance is twice group A's, the initial current is halved, and the final capacitor voltage is the same. ","Capacitor with initial voltage","The capacitor starts at 4 V and is connected to a 10 V source. Is the initial current still 10/R? ","The initial voltage across the driving resistor is the difference between the source and capacitor voltages. ","LR switch-on","The inductor current starts from zero. When is the inductor voltage greatest? ","The inductor voltage is greatest just after the switch closes and approaches zero in steady state. The time constant is L/R. ","LR freewheeling through a resistor","The inductor already carries current. Trace how it dissipates energy through the resistor. ","The inductor current initially keeps its original direction, and the magnetic field energy is converted to heat in the resistor. ","LC oscillation","When the capacitor voltage crosses zero, what are the inductor current and the two stored energies? ","In an ideal LC circuit the electric and magnetic fields store energy alternately; when the capacitor voltage is zero, the magnetic energy is maximum. ","LC with changed initial charge","Halve the capacitor's initial voltage. How do the period and total energy change? ","The period is set by L and C. When the initial capacitor voltage is halved, the initial total energy becomes one quarter. ","RC with doubled resistance","Relative to the RC charging case, double only the resistance. How do the time constant and initial current change? ","When the resistance doubles, the time constant doubles, the initial current halves, and the final capacitor voltage is unchanged. ","RC with doubled capacitance","Relative to the RC charging case, double only the capacitance. How do the time constant and initial current change? ","When the capacitance doubles, the time constant doubles, and the initial current and final capacitor voltage are both unchanged. ","The two ends of an ideal source are shorted. Check the relevant wires and switches. ","A charged capacitor is shorted by an ideal wire. Add a resistor in series in the discharge path. ","The initial voltages of directly connected capacitors are incompatible. Match the initial voltages or add a series resistor. ","The circuit cannot be solved uniquely. Check for ideal sources in parallel or a closed loop of sources only. ","The specified current has lost its closed path. Connect a source loop, or keep a freewheeling path for the inductor. ","The current time window spans too many fast oscillations. Shorten the observation time. ","The circuit state did not converge. Check the connections and component values. ","Millisecond RC · find the time constant","Use the cursor to find when the capacitor reaches 6.32 V. Then change the resistance to 2 kΩ. ","The time constant of 10 V, 1 kΩ, 1 μF is 1 ms, and charging approaches 10 V monotonically. ","Parallel capacitors · measure current division","Add both capacitor currents to the same graph and check the ratio of instantaneous currents. ","At the same rate of voltage change, i=C dV/dt, so current divides in proportion to capacitance. ","Source internal resistance · terminal voltage","Change the load, record the current and load voltage, and infer the internal resistance from the data. ","Load voltage U=E−Ir. With I on the horizontal axis and U on the vertical axis, the slope is −r. ","Bulb brightness · bypass","Predict how the bulb power changes when the bypass switch closes, then measure. ","The bulb is approximated as a constant resistance. When the bypass shorts the bulb, its voltage drop and power are zero. ","Current source · parallel current division","Measure the current in each of the two branches and check conservation of current at the node. ","The current source fixes the total current, and the currents in parallel resistors are inversely proportional to their resistances. ","Series RLC · damping","Starting from a charged capacitor, gradually increase the resistance and find where the oscillation just disappears. ","The critical resistance of a series circuit is 2√(L/C). The resistor dissipates the stored energy. ","Sinusoidal input · RC filter","Watch y>Experiment reasoning and physics</summary><p id=\"m-answer\"></p></details></div>"," Current ",". "," ","<p class=\"muted\">Click “Record measurement” to keep the current parameters, readings and prediction.</p>","Task","Progress","Parameters","Readings","Prediction and evidence","Exit expand","Expand experiment","Gauss's law · flux through each patch of the sphere","Drag the charge, or drag the view to rotate the 3D sphere. After selecting a surface patch, see the electric field, outward normal and E·n together. Field strength is in units of q₀/(4πε₀R²). ","Moving charge x/R","Moving charge y/R","Moving charge q/q₀","Center charge /q₀","Patch polar angle θ (°)","Patch azimuth φ (°)","View azimuth (°)","View tilt (°)","How the patches add up","Change the patch position and record E·n. Explain why, with the charge at the center, E can be taken out of the integral. ","Move the charge, flux unchanged","Move the charge to the other side and find where the local flux changes the most. Why does the total flux stay the same? ","Flux in and out from an outside charge","Find the patches where E·n is negative and where it is positive, and explain how the two parts cancel. ","Strong field with zero net flux","Keep all charges inside and find where the field is strong. Does zero net flux imply E=0? ","Crossing the boundary","Slowly move the charge out of the sphere and describe the changes in the local field and in the enclosed charge. ","The sphere is the chosen integration surface. The field is determined by all charges; the net flux depends only on the net enclosed charge. A patch contributes E·n dA, where n is the outward unit normal. ","3D integration surface · R = 1","Green = outward / orange = inward; shade shows |E·n|","θ (°) along the same meridian","E·n (displayed range ±15)","Selected patch","  E·n = ","Net integrated flux = ","Drag the background to rotate · patch chosen by θ, φ · orange handle is movable","Charge is near the surface; numerical integration is unreliable","120×240 midpoint integration","Selected patch ","outward","inward","Outward Φ₊ ","Inward Φ₋ ","Net Φ ","Theory Q_in/ε₀ "," (flux unit q₀/ε₀)","Gas processes · piston, heat and P–V diagram","0.08 mol of monatomic ideal gas, initial volume 2 L. Work done by the gas is positive, Q = ΔU + W. Drag the final state on the graph, or drag the piston to advance the current process. ","Initial pressure (kPa)","Final / initial volume","High / initial pressure","Same final state, different paths","Complete both paths. Use areas to explain the difference in W, and check whether ΔU is the same. ","Isothermal expansion","The temperature stays constant; where does the energy needed for the expansion come from? Record the middle and final readings. ","Adiabatic expansion","The gas expands with heat exchange cut off. Why does the temperature fall? Check that Q is always zero. ","Isobaric process","During expansion, how is the heat input divided between the change in internal energy and the work? ","Isochoric heating","The gas is heated but the piston is locked. Where does the heat input go? ","Full cycle","Go through all four stages and compare ΔU, net work and net heat absorbed. Change the cycle area and repeat the measurement. ","Return along two paths","Reverse the path and explain how the signs of W, Q and ΔU change. ","The change in internal energy is the same for the same initial and final states; work and heat depend on the process. Quasi-static work is given by ∫P dV. For a monatomic ideal gas, U=3nRT/2. ","PV=nRT  W=∫P dV  ΔU=3nRΔT/2","Piston and gas","Heat in","Heat out","Piston"," K  P ","P (kPa)","V (L)","Final state","W (by gas)","W (on gas)","zero","positive","negative","Path B: W "," J; Q ","Lorentz force · 3D orbit and velocity components","The magnetic field points along z. The 3D orbit can be rotated; at right, v is split into components parallel and perpendicular to B. Normalized mass and charge are used. ","Charge sign","Speed","Angle between v and B (°)", ,"Choose a spherical shell, a uniform solid sphere, or an infinitely long uniformly charged cylinder. Change the Gaussian surface radius and read the interior and exterior fields on the same graph. ","Gaussian surface radius r/R","Charge density factor","Charged spherical shell","Find the interior field from the enclosed charge, and observe how the field strength changes across the shell surface. ","Uniform solid sphere","Inside, Qenc∝r³; why is E∝r? ","Infinite charged cylinder","Compare how the exterior fields of the sphere and the cylinder fall off with distance. ","Identify the distribution from the graph","Give two readings inside and two outside, and explain how to tell a shell from a solid sphere. ","The symmetry of the Gaussian surface makes E constant on the relevant surface. The interior field is determined by how the enclosed charge grows with radius, while the exterior falloff also depends on geometry. ","Sphere: E·4πr²=Qenc/ε₀  Cylinder side: E·2πrℓ=λencℓ/ε₀","Cylinder cross-section; end-face flux is zero","Spherical charge distribution and spherical Gaussian surface","Relative E ","Observation point is inside the charge distribution","Observation point is outside","Potential of continuous charge · from segments to an integral","Total charge is fixed. Divide a ring or a finite thin rod into small segments and compute the potential at a point on the axis. The orange probe can move along the axis. ","Axial distance z/R","Potential on the ring axis","Every segment is the same distance from the probe; how does this simplify the integral? ","Perpendicular bisector of a finite rod","Change the number of segments and record the difference between the discrete sum and the integral. ","Far-field comparison","As the distance grows, why does the potential approach the point-charge result? ","Near-field convergence","Find the number of segments that makes the numerical error less than 1%. ","Potential is a scalar, and each charge element contributes k dq/r. On the ring axis r is the same; for a rod you must integrate over different distances. ","V=∫k dq/r; ring V=kQ/√(R²+z²)","Axial z / R","Discrete sum ","Integral ","Relative error ","Particle in a uniform electric field · trajectory and energy","The field between the parallel plates points along +y; edge effects are ignored. The particle enters from the left with a horizontal initial velocity. Lengths, mass and charge on screen are in normalized units. ","Charge q","Field E","Initial horizontal speed","Positive charge enters","As the speed increases, how does the potential energy change? ","Negative charge enters","Predict the deflection direction first, then explain the change in kinetic energy. ","Increase entry speed","Within the same plate length, why is the deflection smaller? ","Find the field from the trajectory","Measure the exit displacement and use the horizontal flight time to find E. ","Vertical acceleration a=qE/m; horizontal motion is uniform. Work done by the electric force is converted to kinetic energy, and K+U stays constant. ","y=½(qE/m)t²  ΔK=−ΔU","Time","Energy · green K / orange U","Capacitor combinations · charge, voltage and stored energy","Two ideal capacitors are connected across a DC source; observe the state after charging is complete. Drag the voltage handle directly or change the capacitances. ","C₁ (μF)","C₂ (μF)","Source voltage (V)","Series","Why do the two capacitors have equal charge but possibly different voltages? ","Parallel","How is charge shared between the two branches? Use the total charge to check the equivalent capacitance. ","Equivalent capacitance design","Keep C₁=6 μF and adjust C₂ so that the series equivalent capacitance is 2 μF. ","Compare stored energy","At the same source voltage, which connection stores more energy? Verify by comparing with A. ","Series capacitors carry the same charge and their voltages add; parallel capacitors have equal voltages and their charges add. The total stored energy is the sum of each capacitor's energy. ","U=½CV²  Series 1/Ceq=1/C₁+1/C₂  Parallel Ceq=C₁+C₂","Series connection","Parallel connection","Source ","Charge (μC)","Energy (μJ)","Total charge ","Total energy ","Conducting cavity · induced charge and grounding","A concentric spherical conducting shell with inner radius a=1 and outer radius b=1.6. A point charge sits at the center of the cavity, and the shell itself may carry net charge. The model keeps spherical symmetry. ","Cavity-center charge / q₀","Net charge of isolated shell / q₀","Probe radius r/a","Neutral isolated shell","Check the charge on the inner and outer walls and explain why E=0 inside the metal. ","Charge the shell","Where does the added charge appear? Does the field in the cavity change? ","Grounded","Compare the outer-wall charge and the field outside the shell before and after grounding. ","Judge from outside measurements","The field outside the shell is zero; does this mean there is no charge in the cavity? ","Zero field inside the metal forces the total charge on the inner surface to be −q. The outer surface of an isolated shell carries Q+q; the outer surface of a concentric grounded shell carries zero charge. ","Qinner=−q  Qouter=Q+q (isolated)","Inner wall ","q₀  Outer wall ","Normalized Eᵣ","Inner surface charge ","Outer surface charge ","Conductor grounded","Conductor isolated","Resistivity · length and cross-sectional area","A cylindrical wire keeps a uniform cross-section. Drag the length handle and adjust the cross-sectional area through the radius; the source fixes the terminal voltage. ","Length (m)","Radius (mm)","Resistivity (μΩ·m)","Terminal voltage (V)","Length sweep","Record the resistance at three lengths and determine the relation between R and L. ","Double the radius","Predict the factor by which the resistance changes, then explain the result with the cross-sectional area. ","Material choice","With fixed geometry, find the resistivity of the material from measured V and I. ","Equal-resistance design","Adjust the radius so the lengthened wire keeps its original resistance. ","R=ρL/A, and for a circular cross-section A=πr². Doubling the radius makes the area four times as large. At the same voltage, current is inversely proportional to resistance. ","R=ρL/(πr²)  I=V/R","Length","L (m)","R (Ω)","Current-element superposition · ring and solenoid","Observe how the field on the axis is built up from the current elements. Lengths are normalized to the coil radius R and the field to μ₀I/(2R). ","Axial position z/R","Total turns N","Solenoid length ℓ/R","Single ring","Change the axial position and explain why the field components perpendicular to the axis cancel. ","Finite solenoid","Compare the field at the center, near the ends and outside, and note that the field at the ends does not drop to zero abruptly. ","Long-solenoid approximation","Compare the central field with the approximation μ₀NI/ℓ and explain the end effect. ","Locate the coil center by measurement","Move the probe along the axis and use the readings to find where the field is greatest. ","The transverse components of symmetric current elements on the ring cancel, and the axial components add. A finite solenoid can be viewed as a set of rings distributed along the axis. ","Ring Bz=μ₀IR²/[2(R²+z²)^(3/2)]","Field probe","Normalized Bz","Long-tube central approx. ","Axis-center max 1","Current-carrying wire force · direction and magnitude","The uniform magnetic field points along +x and the wire lies in the plane of the screen. Drag the wire endpoint to change the angle; the force direction out of / into the screen is shown with ⊙/⊗. ","Angle between current and B (°)","Magnetic field (T)","Effective length (m)","Direction finding","Predict the force direction with the right-hand rule, then change the angle to check. ","Wire parallel to the field","Both current and field are nonzero; why is the force zero? ","After reversing the current direction, how do the direction and magnitude of the magnetic force change? ","Find the maximum magnetic force","Adjust only the angle and find the direction where |F| is greatest. ","F=Iℓ×B. In the figure B points along +x; when the current has a +y component, the magnetic force for a positive current points into the screen. ","I ref. direction","θ (°)","Fz (N)","Magnetic force points out of the screen","Magnetic force points into the screen","Magnetic force is zero","Magnetic dipole · torque and potential energy","The magnetic moment μ of a current loop is along the normal to the loop plane. Drag the moment arrow to rotate it relative to the uniform field. ","Angle between μ and B (°)","Magnetic moment (A·m²)","Lowest-energy position","Find the stable equilibrium direction and state the direction of the torque after a small deflection. ","Antiparallel equilibrium","The torque is zero here, but why is this an unstable equilibrium? ","Slow rotation by an external force","How much work does the external force do turning from the parallel direction to the current angle? ","The torque tends to align the magnetic moment with the field. U=−μB cosθ; in quasi-static rotation the work done by the external force equals the increase in potential energy. ","τz=−μB sinθ  U=−μB cosθ","U (J)","External work from θ=0 to here ","Sliding rod on rails · induction and energy conservation","A conducting rod of length ℓ moves along rails in a uniform magnetic field pointing out of the screen. The closed loop has resistance R; self-inductance and friction are ignored. ","Rod length (m)","Loop resistance (Ω)","Initial or pulling speed (m/s)","Constant-speed pull","Compare the pulling power Fv with the resistive heating power I²R and explain where the energy comes from. ","Remove the pulling force","Predict the change in speed first, then look at the sum of kinetic energy and Joule heat. ","Change the resistance","When the resistance decreases, does the current get larger or smaller? How does the damping change? ","Measure the field · open circuit","Find the field strength from the open-circuit emf and the rod's speed and length. ","ε=Bℓv, I=ε/R, and the magnetic drag force has magnitude B²ℓ²v/R. At constant speed the external force supplies the energy; when decelerating freely, kinetic energy is converted to heat. ","ε=Bℓv  Fmag=−B²ℓ²v/R  Pheat=I²R","Sliding rod","Open circuit: ε ≠ 0, I = 0, F = 0","Induced current: clockwise, producing a field into the screen","Gap","t (s)","v (m/s)","Mechanical power Fv = ","Joule heating power I²R = ","Accumulated heat ","Kinetic energy now ","Rotating coil · flux and AC emf","The coil rotates at constant angular speed, with the normal at angle θ to the field. Drag the normal or play one full period. ","Turns","Area (m²)","Angular speed (rad/s)","At maximum flux","Pause at the position of maximum flux; what is the induced emf? ","Increase rotation speed","When the rotation speed doubles, how do the peak emf and the period change? ","Increase turns","Is the change in the single-turn flux the same as in the total flux linkage? ","Find rotation speed from the graph","From the period and peak value, infer the angular speed and NBA. ","The rate of change of the flux linkage NBA cosθ determines the emf. The two differ by a quarter period. ","NΦ=NBA cosωt  ε=NBAω sinωt","Side view: coil cross-section ⟂ normal; axis perpendicular to screen","Flux linkage NΦ (Wb)","ε (V)","Period ","Optics bench · imaging and screen","Thin lenses and spherical mirrors use the paraxial approximation. Drag the object, focal point or screen; orange dashed lines show the backward extension of rays. ","Object distance (cm)","Focal length magnitude (cm)","Object height (cm)","Screen distance (cm)","Converging lens · real image","Drag the screen to find a sharp image, then measure the magnification. ","Converging lens · virtual image","When the image forms inside the focal length, why can't moving the screen make the exiting rays converge? ","Diverging lens","Change the object distance and observe the position, size and orientation of the image. ","Concave mirror","Use reflected rays to decide whether the real image appears in front of or behind the mirror. ","Convex mirror","Compare what convex-mirror and diverging-lens images have in common. ","Find focal length from imaging","Use the object distance and the sharp-image distance to find the focal length, then check with another object distance. ","1/f=1/do+1/di. di>0 means the exiting rays actually converge; di<0 means their backward extensions intersect. Magnification m=−di/do. ","1/f = 1/do + 1/di  m = −di/do","Green: actual propagation; orange dashed: backward extension","Image","Screen","F (exit side)","Ray separation on screen ","Screen is near the sharp image position","Move the screen so the two rays meet","Object at the focus; exiting rays are parallel","Real image","Virtual image"," di=","Magnification ","Screen ray separation ","Refraction and total internal reflection · critical-angle experiment","Drag the incident beam to change the angle of incidence. Angles are measured from the normal to the interface; a critical angle exists only when light passes from a medium of higher index of refraction into one of lower. ","Incident-side index of refraction n₁","Transmission-side index of refraction n₂","Angle of incidence (°)","Find the critical angle","Gradually increase the angle of incidence and record the condition at which the transmitted angle reaches 90°. ","Incidence from low index","However much the angle of incidence is increased, can total internal reflection occur? ","Measure a material by refraction","Record several pairs of incidence and refraction angles and use sinθ₁/sinθ₂ to find n₂. ","n₁ sinθ₁=n₂ sinθ₂. For n₁>n₂, θc=arcsin(n₂/n₁); beyond this angle total internal reflection occurs. ","Incident ray","Transmitted angle (°)","Angle of incidence ","Total internal reflection","Transmitted angle ","Critical angle ","No critical angle for this direction of incidence","Standing waves · traveling-wave superposition and resonance","Two traveling waves (top and bottom) propagate in opposite directions, and their superposition is shown at the bottom. The model uses sinusoidal modes of a string with fixed ends; the frequency is set by the wave speed and the boundaries. ","Harmonic number n","String length (m)","Wave speed (m/s)","Find the nodes","Record the position of each node. Both traveling waves are moving; why do the nodes stay at rest? ","Fundamental","Find the lowest mode and use the boundary conditions to explain why the wavelength is 2L. ","Third harmonic","Count the antinodes and compare the frequency with the fundamental frequency. ","Change string length","Keep the harmonic number and wave speed fixed; how does the string length change the frequency? ","Two waves of the same frequency and amplitude traveling in opposite directions are superposed. Fixed ends require zero displacement at the endpoints, so λn=2L/n and fn=nv/(2L). ","Traveling right →","← Traveling left","Superposition · standing wave","Nodes ","Horizontal axis labeled in m","Wave boundary · incidence, reflection and transmission","Two strings are joined under the same tension. Wave speed v=√(T/μ), and the mechanical impedances on the two sides differ. A Gaussian pulse splits into reflected and transmitted parts at the boundary. ","Right linear density / left linear density","Light to heavy string","Is the reflected pulse inverted? How does the speed of the transmitted wave change? ","Heavy to light string","How does the direction of the reflected pulse differ from the previous case? ","Matched boundary","When does the reflection disappear? ","Check energy conservation","Calculate the energy fractions reflected and transmitted separately, and explain why the sum of the amplitudes is not enough to judge energy. ","The displacement reflection coefficient is r=(Z₁−Z₂)/(Z₁+Z₂) and the transmission coefficient is t=2Z₁/(Z₁+Z₂). The energy fractions are r² and (Z₂/Z₁)t². ","Z=√(Tμ)  R+T=1","Left μ₁, v₁","Right ermal final pressure is lower, because the gas keeps absorbing heat during an isothermal process","The adiabatic final pressure is lower, because its temperature also falls","They are the same, because the final volume is the same","They cannot be compared, because the work is different","In isobaric expansion P="," kPa stays constant, and the work done by the gas is W_by=PΔV="," J. The temperature rises from "," K to "," K, and ΔU=3nRΔT/2="," J. The heat absorbed, Q=ΔU+W_by="," J, is split into two parts: about ","% increases the internal energy and about ","% is work done by the gas (for a monatomic gas Q=5nRΔT/2, so the ratio is fixed at 3:2). With the current convention, "," J. ","Isobaric expansion, initial pressure "," kPa, initial volume 2 L. If “final volume/initial volume” is changed to 1.3, how much heat Q does the gas absorb, in J? ","At constant volume the piston is locked, ΔV=0, and the P–V diagram is a vertical line with zero area, so W=0. The input heat therefore has no chance to do work and all becomes internal energy: Q=ΔU=3V(P₂−P₁)/2=1.5×2 L×("," J, and the temperature rises from "," K. This conclusion does not depend on the work convention: W is 0 under both conventions, so "," gives Q=","Isochoric heating, initial pressure "," kPa, volume 2 L. If “high/initial pressure” is changed to 1.8 (the pressure rises to 1.8 times the initial pressure), how much heat does the gas absorb, in J? ","The cycle returns to its starting point and U is a state function, so ΔU=0. The four legs are: isochoric pressure rise (W=0), then at "," kPa isobaric expansion (work done by the gas "," J), isochoric pressure drop (W=0), then at "," kPa isobaric compression (work done by the gas −"," J). The net work equals the rectangle area (ΔP)(ΔV)="," J; for a clockwise cycle the gas does net work. With the current convention, "," J; from ΔU=0 the net heat absorbed is Q="," J, specifically it absorbs "," J and releases "," J. Raising “high/initial pressure” or the final volume
